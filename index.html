// ===================================================================
// 診断モード（目視に依存せずシーン状態をテキストで確認する）
//   ・Hキーで画面に診断パネルをトグル表示
//   ・コンソールで diag() を実行すると同じ内容を出力（コピペで共有できる）
// ===================================================================
const diag = { glb: { tried:false, ok:false, error:null, vertices:0, meshes:0 } };
const diagEl = document.createElement('pre');
diagEl.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:30;margin:0;padding:10px;'
  + 'background:rgba(0,0,0,.72);color:#9effa0;font:12px/1.5 monospace;border-radius:6px;'
  + 'white-space:pre;display:none;pointer-events:none;max-width:90vw;';
document.body.appendChild(diagEl);
let diagVisible = false;
function buildDiag() {
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  let lc = 0; const ls = [];
  scene.traverse(o => { if (o.isLight) { lc++; ls.push(`${o.type}=${o.intensity.toFixed(2)}`); } });
  let nonNull = 0; for (const m of meshes.values()) if (m) nonNull++;
  // 最寄りの「乗れる船」（登録済みプロップから探索＝表示範囲内に船があるか星野さんが一目で分かる）
  let nbd = Infinity, nbDx = 0, nbDz = 0, nbKind = '';
  for (const p of props.values()) {
    if (p.kind !== 'ship_rowboat' && p.kind !== 'ship_sailboat') continue;
    const dx = p.x + 0.5 - player.pos.x, dz = p.z + 0.5 - player.pos.z, d = Math.hypot(dx, dz);
    if (d < nbd) { nbd = d; nbDx = dx; nbDz = dz; nbKind = p.kind; }
  }
  // 8方位（-Z=北・+X=東。船首は-Z＝北向き基準）
  const compass8 = (dx, dz) => ['北','北東','東','南東','南','南西','西','北西'][Math.round(Math.atan2(dx, -dz) / (Math.PI/4) + 8) % 8];
  const nearBoat = nbd === Infinity ? '範囲内になし（歩いて海岸へ）'
    : `${nbd.toFixed(0)}m ${compass8(nbDx, nbDz)}（${nbKind === 'ship_sailboat' ? '帆船' : '小舟'}）`;
  const hh = Math.floor(((dayTime + 0.5) % 1) * 24);
  const mm = Math.floor((((dayTime + 0.5) % 1) * 24 % 1) * 60);
  const g = diag.glb;
  const glbStr = !g.tried ? '読込中…'
    : g.ok ? `OK（頂点${g.vertices} / メッシュ${g.meshes}）`
    : `失敗：${g.error}`;
  return [
    `=== VOXEL WORLD 診断（build ${BUILD}）===`,
    `FPS          : ${fpsEMA.toFixed(0)}　保存スロット: ${currentSlot}/${MAX_SLOTS}`,
    `経路探索負荷 : ${pathCallsPerSec}回/秒（ノード計${pathNodesPerSec}/秒）`,
    `プロトコル   : ${location.protocol}${location.protocol === 'file:' ? '（※file:ではGLB読込不可。HTTPサーバー/Pagesで開く）' : ''}`,
    `チャンクmesh : 総${meshes.size} / 描画あり${nonNull}`,
    `player.glb   : ${glbStr}`,
    `アバター反映 : ${playerAvatar ? '有' : '無'}（表示=${playerAvatar && playerAvatar.visible ? 'ON' : 'OFF'} / 色=${(currentPlayerFile.match(/player_?(\w*)\.glb/)||[])[1]||'標準'}）`,
    `ライト       : ${lc}個 [${ls.join(', ')}]`,
    `背景色       : #${scene.background.getHexString()}`,
    `カメラ位置   : ${camera.position.x.toFixed(1)}, ${camera.position.y.toFixed(1)}, ${camera.position.z.toFixed(1)}`,
    `カメラ向き   : ${dir.x.toFixed(2)}, ${dir.y.toFixed(2)}, ${dir.z.toFixed(2)}`,
    `視点         : ${thirdPerson ? '三人称' : '一人称'}`,
    `アバター向き : ${(avatarYaw*180/Math.PI).toFixed(0)}°`,
    `プレイヤー   : ${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}`,
    `時刻 / 天候  : ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} / ${weather}`,
    `HP / 空腹 / 息 : ${hp}/${maxHpEff()} / ${hunger.toFixed(1)}/${P.maxHunger} / ${breath.toFixed(1)}`,
    `レベル        : Lv${playerLevel}（EXP ${Math.round(playerExp)}/${expToNext(playerLevel)}）攻撃+${((playerLevel-1)*CFG.level.dmgPerLevel).toFixed(1)}`,
    `減少速度(/分) : 空腹 ${hungerRatePerMin.toFixed(1)} / HP ${hpRatePerMin.toFixed(1)}　※正=減少・負=回復`,
    `最後の被ダメ  : ${lastDamageCause}（${(gameTime - lastDamageTime).toFixed(0)}秒前）`,
    `水際判定      : 頭水中${dbgHeadWater?'○':'-'} / 岸ledge${dbgShore>0?dbgShore+'段':'なし'} / ステップアップ${dbgStepUp?'発動中○':'-'}`,
    `水中判定実値  : 頭blk[y${Math.floor(player.pos.y+PH-0.1)}]=${NAMES[getBlock(Math.floor(player.pos.x),Math.floor(player.pos.y+PH-0.1),Math.floor(player.pos.z))]||'空気'} / 足blk[y${Math.floor(player.pos.y+0.2)}]=${NAMES[getBlock(Math.floor(player.pos.x),Math.floor(player.pos.y+0.2),Math.floor(player.pos.z))]||'空気'} / 接地${player.onGround?'○':'-'}（水なら水中判定が正しい・空気なら別要因/キャッシュ疑い）`,
    `BGMシーン     : ${musicScene||'-'}（近接敵${dbgNearEnemies} / 水中${dbgMusicWater?'○':'-'} / combat保持${combatHold.toFixed(1)}s）`,
    `選択ブロック : ${NAMES[selBlock]}（所持${counts[selBlock]||0}）${invOpen ? ' / インベントリ開' : ''}`,
    `バイオーム   : ${biomeAt(Math.floor(player.pos.x), Math.floor(player.pos.z))}`,
    `スポーン拠点 : ${spawnPoint ? `${spawnPoint.x.toFixed(0)},${spawnPoint.y.toFixed(0)},${spawnPoint.z.toFixed(0)}（${biomeAt(Math.floor(spawnPoint.x), Math.floor(spawnPoint.z))}）` : '未決定'}　※死亡/奈落で常にここへ復帰（oceanなら水際スポーンの兆候）`,
    `騎乗/乗船    : ${ridingMob ? '馬に騎乗中' : ridingBoat ? `船に乗船中(${ridingBoat.kind}/obj${ridingBoat.obj?'有':'無'})` : '徒歩'}　速度vel: ${player.vel.x.toFixed(1)},${player.vel.z.toFixed(1)}`,
    `R判定        : ${dbgRideMsg}（近接 乗船可船${dbgRideBoats}/難破船${dbgRideWrecks} 馬${mobs.filter(m=>m.def.type==='horse').length}体）`,
    `最寄り乗れる船: ${nearBoat}`,
    `最寄り王国城 : ${navLine(player.pos.x, player.pos.z, nearestDeterministic(player.pos.x, player.pos.z, CASTLE_CELL, 3, castleCenter))}　※近衛兵＋最奥にボス(ドラゴン)＋特別報酬`,
    `最寄り魔窟(ボス) : ${navLine(player.pos.x, player.pos.z, nearestDeterministic(player.pos.x, player.pos.z, DUNGEON_CELL, 4, dungeonLairMouth))}　※入口は地上の階段口・掘らず歩いて降りる→奥にデーモン`,
    `最寄り洞窟(横穴): ${navLine(player.pos.x, player.pos.z, nearestDeterministic(player.pos.x, player.pos.z, HCAVE_CELL, 3, hillCaveMouth))}　※山/丘の斜面の入口・掘らず歩いて入れる（奥に鉱石/宝/装飾）`,
    `最寄り海ボス : ${navLine(player.pos.x, player.pos.z, nearestDeterministic(player.pos.x, player.pos.z, KRAKEN_CELL, 4, krakenSpot))}　※深海/外洋・船で接近すると海面にクラーケン出現`,
    `最寄りさくらの間: ${navLine(player.pos.x, player.pos.z, nearestDeterministic(player.pos.x, player.pos.z, SAKURA_CELL, 2, sakuraCenter))}　※★最終ボス 女王さくら（最も希少な間・歩いて入る）`,
    `武器 / 戦闘  : 装備=${WEAPONS[currentWeapon].name}（C/Bで切替）所持[${WEAPON_ORDER.filter(w=>ownedWeapons.has(w)).map(w=>WEAPONS[w].name).join('・')}] / コンボ${comboIndex} / 振り${swingTimer>0?'中':'-'}`,
    `攻撃の特性   : ${WEAPONS[currentWeapon].ranged?'遠距離(溜め)':'近接'} 威力${WEAPONS[currentWeapon].dmg} 間合${WEAPONS[currentWeapon].reach} 振り${WEAPONS[currentWeapon].swing}s 動作x${WEAPONS[currentWeapon].anim} 止${WEAPONS[currentWeapon].hitstop}s（装備武器で変化）`,
    `手持ち表示   : 武器モデル${heldWeapon?'装着○':'なし(素手/未読込)'} / 盾${heldShield?'装着○':'-'} / 武器テンプレ読込${Object.keys(equipTemplates).length}種`,
    `装備防御     : ${(defenseFactor()*100).toFixed(0)}% 軽減（防具 頭${equip.armor.head?'○':'-'}/胴${equip.armor.body?'○':'-'}/脚${equip.armor.legs?'○':'-'} 盾${equip.shield?'○':'-'}）`,
    `再生アニメ   : ${curAction === actSwim ? 'swim' : curAction === actWalk ? 'walk' : curAction === actIdle ? 'idle' : curAction === actAttack ? 'attack' : '-'}（前傾${(avatarPitch*180/Math.PI).toFixed(0)}° / 歩き始め=${moveStartAnimName}）/ clips:[${(diag.glb.clips||[]).join(',')}]`,
    `swim選択理由 : ${ridingBoat ? '-乗船中(swim無効)' : ridingMob ? '-騎乗中(swim無効)' : playerHeadInWater() ? '○頭が水中→swim' : '-頭は空気→walk/idle'}（actSwim=${actSwim ? (actSwim.isRunning()?'再生中':'停止') : '無'}）`,
    `モブ         : ${mobs.length}/${M.totalCap}体（敵${mobs.filter(m=>m.hostile).length}/${M.hostileCap} 住人${mobs.filter(m=>m.home).length} テンプレ${Object.keys(mobTemplates).length}種 矢${arrows.length}）`,
    `モブ地中埋没  : ${mobs.filter(m=>m.buried).length}体（透明な敵の監視。0が正常／復帰処理が毎フレーム作動）`,
    `ボス討伐記録 : ドラゴン${bossKills.dragon||0} / スケ王${bossKills.skeleton_king||0} / デーモン${bossKills.demon||0} / クラーケン${bossKills.kraken||0} / 女王さくら${bossKills.queen_sakura||0} / ゴーレム${bossKills.golem||0}　マント${hasSakuraCape?'○':'-'}`,
    `仲間         : ${companions.length}/${MAX_COMPANIONS}人 ${companions.map(c=>`${JOB_LABEL[c.def.type]||c.def.type}(HP${Math.ceil(c.hp)}/${c.maxHp}・${c.cmdMode})`).join(' / ')||'なし'}　※T会話→Y雇用(${COMPANION_COST}coin)／U指示切替(追従/攻撃/待機)`,
    `ペット🐾     : ${pets.length}/${MAX_PETS}匹 ${pets.map(p=>`${p.petName}[${(p.traits||[]).map(t=>PET_TRAITS[t].label).join('・')}](${petMoodLabel(p)}${Math.round(p.mood)}/空腹${Math.round(p.petHunger)})`).join(' / ')||'なし'}　※Pでなでる/餌・なつかせる`,
    `湧き環境     : ${isNight() ? '夜' : isDay() ? '昼' : '薄明'} / ${playerUnderground() ? '地下(常時湧き)' : '地上'}`,
    `構造物       : 村${villages.size} / スポナー${spawners.size} / プロップ${props.size}(表示${[...props.values()].filter(p=>p.obj).length}) / structテンプレ${Object.keys(structTemplates).length}種`,
    `ドロップ     : 地面${drops.length} / 肉${itemCounts.meat} 卵${itemCounts.egg} コイン${itemCounts.coin} りんご${itemCounts.apple}`,
    `採掘素材     : 石炭${itemCounts.coal} 鉄${itemCounts.iron} 金${itemCounts.gold}`,
  ].join('\n');
}
window.diag = () => { const s = buildDiag(); console.log(s); return s; }; // コンソールから diag()

// ===================================================================
// GLB キャラ読み込み口（4号機の成果物をここから差し込む）
//   models/ に .glb を置いて push すれば、このゲームに即反映される
// ===================================================================
const gltfLoader = new GLTFLoader();

// GLB をワールドに配置。失敗（404＝まだ未配置）は静かに無視する
//   url: ファイルパス, pos: ブロック座標, opts: { yaw(ラジアン), scale }
function loadCharacter(url, pos, opts = {}) {
  gltfLoader.load(url,
    (gltf) => {
      const model = gltf.scene;
      model.position.set(pos.x, pos.y, pos.z);
      if (opts.yaw)   model.rotation.y = opts.yaw;
      if (opts.scale) model.scale.setScalar(opts.scale);
      scene.add(model);
      console.log('[voxel] モデル読込成功:', url);
    },
    undefined,
    () => { /* まだ models/ に GLB が無い間は無視（4号機の push 待ち） */ }
  );
}

// プレイヤーのアバター：player.glb を本人モデルとして読み込み、三人称時に表示する
//   （4号機の本番モデルに差し替わると、そのまま自分のキャラとして見える）
let playerAvatar = null;
// ⑤ アニメ再生土台（クリップが無くてもエラーにならない作り）
let mixer = null, actIdle = null, actWalk = null, actAttack = null, actSwim = null, curAction = null;
let avatarAttackTimer = 0; // >0 の間は攻撃モーション再生中（idle/walk へ戻さない）
let avatarPitch = 0;       // 三人称アバターの前傾（0=立ち / -PI/2=うつ伏せ＝泳ぎ姿勢）。滑らかに補間
let playerIsChinchilla = false; // 主人公がチンチラか（アニメ無し→コードでぴょこぴょこ＆スケール調整）
let playerHopT = 0;        // チンチラ主人公の弾みタイマー
let wasMoving = false;            // 前フレームの移動状態（移動開始の立ち上がり検出用）
let moveStartAnimName = '-';      // 直近の「歩き始め」で選ばれたアニメ名（H診断用＝開始時に泳いでないか確認）
function playAvatarAnim(moving, swimming) {
  if (!mixer || avatarAttackTimer > 0) return; // 攻撃中は上書きしない
  const target = (swimming && actSwim) ? actSwim : moving ? actWalk : actIdle; // swimクリップがあれば優先（4号機到着で自動）
  // ★swim を選んでいないのに actSwim が動いていれば即 stop（陸での泳ぎ固着の残渣を毎フレーム断つ）。
  //   fadeOut は weight=0 でも running が残りうるため、陸では hard stop で確実に消す。
  if (target !== actSwim && actSwim && actSwim.isRunning()) actSwim.stop();
  if (target && target !== curAction) {
    target.reset().fadeIn(0.15).play();
    // ★切替時は target 以外の待機/歩行/泳ぎを「全て」確実にフェードアウト。
    //   curAction だけ消す旧実装だと、過去に再生した swim 等が weight>0 のまま残り
    //   「陸なのに泳ぎ姿勢が固着・攻撃でしか抜けない」不具合になっていた（星野さん報告の根治）。
    for (const a of [actIdle, actWalk, actSwim]) if (a && a !== target) a.fadeOut(0.15);
    curAction = target;
  }
}
// ロード/スポーン/復活の直後にアバターのアニメ状態を idle へ明示リセット（swim等の引きずりを断つ）。
//   mixer 未読込（アバター読込前）なら no-op＝loadAvatar 側の初期 idle に委ねる。
function resetAvatarAnim() {
  if (!mixer) return;
  for (const a of [actIdle, actWalk, actSwim, actAttack]) if (a) a.stop();
  avatarAttackTimer = 0; avatarPitch = 0;
  if (actIdle) { actIdle.reset().play(); curAction = actIdle; } else curAction = null;
}
// 攻撃モーションを1回再生（三人称アバター）。終了後 playAvatarAnim が idle/walk を貼り直す
function playAvatarAttack() {
  if (!mixer || !actAttack) return;
  if (curAction) curAction.fadeOut(0.08);
  const scale = WEAPONS[currentWeapon].anim || 1; // 武器別モーション速度（斧=大振り遅い/素手=素早い）
  actAttack.reset(); actAttack.timeScale = scale; actAttack.fadeIn(0.05).play();
  curAction = null;
  avatarAttackTimer = (actAttack.getClip().duration || 0.4) / scale; // 倍率分だけ再生時間も伸縮
}

// ===================================================================
// 武器の手持ち表示（EQUIP_HOLD.md §3 ワールド追従方式）：装備モデルを*シーン直下*に置き、
//   毎フレーム「手のワールド位置 ＋ 腕のワールド回転」だけを写して配置する（武器 scale=1.0＝実寸）。
//   ※player.glb の腕ノードは非一様スケール(Body[.3,.3,.17]×Arm[.333,.367,.647])を持つため、
//     腕へ直接子付けすると*せん断歪み*で向き・形が崩れる（剣が背中・盾が腕裏に回る主因）。
//     getWorldQuaternion は scale を無視するので、これで歪みを持ち込まず姿勢追従できる（§3推奨）。
// ===================================================================
//   hand: 'R'=右手(剣/斧/ピッケル) / 'L'=左手(弓/盾)。rotX=グリップ前傾(rad)。offset=手アンカーからの体フレーム(glTF)ずらし。
const HOLD = {
  sword:   { hand:'R', rotX:-0.314, offset:[0,0,0] },        // 刃を上やや前へ(-18°)・原点=握り中央
  steel_sword: { hand:'R', rotX:-0.314, offset:[0,0,0] },    // 鋼の剣（見た目は剣モデル流用）
  gold_sword:  { hand:'R', rotX:-0.314, offset:[0,0,0] },    // 金の剣（同上）
  axe:     { hand:'R', rotX:-0.21,  offset:[0,0,0] },        // 斧頭を上前方(-12°)
  pickaxe: { hand:'R', rotX:-0.21,  offset:[0,0,0] },        // 頭を上前方(-12°)
  bow:     { hand:'L', rotX: 0.14,  offset:[0,0.05,-0.04] }, // 弓を縦(+8°)・握り中央へ
};
const SHIELD_HOLD = { hand:'L', rotX:0, offset:[0.02, 0.32, -0.16] }; // 左前腕・表(-Z=前)。Z=-0.16で前へ／Y回転0(180°反転禁止＝腕裏に回る)
const HAND_LOCAL = { R:[-0.43, 0.72, 0.0], L:[0.43, 0.72, 0.0] };     // §1 手アンカー(中立・player.glbノード実測 2026-06-04)
let heldWeapon = null, heldShield = null;
// 腕の装着リグ（bind pose で採取＝アニメポーズ・アバター向きに非依存の不変基準）。
//   shoulder/armToHand: §1 の肩ピボットと「中立 肩→手ベクトル」（アバターローカル・全長~0.74m）。
//   relQbindInv: inv(腕のアバター相対回転 R_rel_bind)。振りデルタ D の算出と grip 較正に共用。
//   ※手位置は「肩＋D・(肩→手)」で出す（腕中心の素直な回転）。腕ローカル点を使う旧方式は腕の非一様スケールで
//     ローカル座標が巨大化(±12)し、ポーズ差で数m暴れた（剣が空中・盾が地面の主因）→ 肩中心方式で安定化。
let handRig = { R: null, L: null };
const SHOULDER = { R: [-0.30, 1.46, 0.0], L: [0.30, 1.46, 0.0] }; // §1 肩ピボット（アバターローカル・腕の回転中心）
function captureHandRig() {
  handRig = { R: null, L: null };
  if (!playerAvatar) return;
  playerAvatar.updateWorldMatrix(true, true); // bind pose（mixer 未更新）で腕の world を確定
  const avQ = new THREE.Quaternion(); playerAvatar.getWorldQuaternion(avQ);
  for (const h of ['R', 'L']) {
    const node = playerAvatar.getObjectByName(h === 'R' ? 'ArmR' : 'ArmL');
    if (!node) continue;
    node.updateWorldMatrix(true, false);
    const armQ = new THREE.Quaternion(); node.getWorldQuaternion(armQ);
    const relQbind = avQ.clone().invert().multiply(armQ); // R_rel_bind = inv(avQ)*armQ
    const a = HAND_LOCAL[h], s = SHOULDER[h];
    handRig[h] = {
      node,
      shoulder: new THREE.Vector3(s[0], s[1], s[2]),                          // 肩ピボット（アバターローカル）
      armToHand: new THREE.Vector3(a[0]-s[0], a[1]-s[1], a[2]-s[2]),          // 中立 肩→手（アバターローカル・~0.74m）
      relQbindInv: relQbind.invert(),                                         // inv(R_rel_bind)
    };
  }
}
// 装着：シーン直下に追加し hold 設定を持たせる（位置/姿勢は updateHeldTransforms が毎フレーム決める）。
function attachWorldFollow(obj, hand, rotX, offset) {
  if (!obj) return;
  obj.scale.set(1, 1, 1); // 実寸（腕の非一様スケールを乗せない＝せん断なし）
  obj.userData.hold = { hand, gripQ: new THREE.Quaternion().setFromEuler(new THREE.Euler(rotX || 0, 0, 0)), offset: offset || [0,0,0] };
  scene.add(obj);
  obj.visible = thirdPerson;
}
// 毎フレーム：手のワールド変換だけを写して武器/盾を配置（§3）。mixer.update の後に呼ぶ＝腕ポーズ最新。
//   ★平行移動は playerAvatar.matrixWorld に依存せず、権威ある player.pos を直接基準にする（移動追従の確実化）。
//   向きは avatarYaw/avatarPitch から再構成（アバターは scene 直下＝回転は Euler(YXZ) と一致）。
const _avQ = new THREE.Quaternion(), _armQ = new THREE.Quaternion(), _relNow = new THREE.Quaternion(),
      _D = new THREE.Quaternion(), _hl = new THREE.Vector3(), _off = new THREE.Vector3(), _avE = new THREE.Euler();
function placeHeld(obj) {
  if (!obj) return;
  const hd = obj.userData.hold, rig = hd && handRig[hd.hand];
  if (!rig) { obj.visible = false; return; }
  obj.visible = thirdPerson; // シーン直下＝アバターの visible を継承しないので明示（一人称では非表示）
  rig.node.updateWorldMatrix(true, false);  // 腕ポーズの world を最新化（D 算出用）
  _avE.set(avatarPitch, avatarYaw, 0, 'YXZ'); _avQ.setFromEuler(_avE); // アバターの現在の向き（権威・matrixWorld非依存）
  rig.node.getWorldQuaternion(_armQ);                                   // 腕の現在 world 回転
  // 腕の振りデルタ D（アバターローカル）= R_rel_now * inv(R_rel_bind)。位置・姿勢はこの D で追従。
  _relNow.copy(_avQ).invert().multiply(_armQ);   // R_rel_now = inv(avQ)*armQ
  _D.copy(_relNow).multiply(rig.relQbindInv);     // D
  // 位置：アバターローカルで 肩 + D・(中立 肩→手)（肩から常に~0.74mで暴れない）→ 向きで回し → ★player.pos を足す＝必ず追従
  _hl.copy(rig.armToHand).applyQuaternion(_D).add(rig.shoulder);
  _hl.applyQuaternion(_avQ).add(player.pos);
  _off.set(hd.offset[0], hd.offset[1], hd.offset[2]).applyQuaternion(_avQ); // オフセットは体フレーム（-Z=前）
  obj.position.copy(_hl).add(_off);
  // 姿勢：体フレームの grip のみ（武器は標準 Y-up＝刃/高さ=+Y・表面=-Z）。
  //   ★腕の回転デルタ D は「位置追従」にだけ使い、姿勢には掛けない。D を姿勢に掛けると idle「戦士の構え」で
  //     腕が前へ約90°回るぶん刃が寝る（＝4号機 §6 指摘の 90°/X・右手180°(B) の実体）。
  //     grip のみなら 剣 up≈(0,+0.95,-0.31)・盾 up≈(0,+1,0)＝刃が上前向き・盾の表が前、で左右とも正。
  obj.quaternion.copy(_avQ).multiply(hd.gripQ);
}
function updateHeldTransforms() {
  if (!playerAvatar) return;
  placeHeld(heldWeapon); placeHeld(heldShield);
}
// 装備中の武器/盾をシーンに反映（装備変更・アバター読込・武器モデル読込後に呼ぶ）

}

  if (heldShield && heldShield.parent) heldShield.parent.remove(heldShield);

function loadAvatar(file) {
  if (!file || file.indexOf('chinchilla') < 0) file = DEFAULT_PLAYER_FILE; // 主人公は必ずチンチラ（旧人間アバターは弾く）
  currentPlayerFile = file;
  try { localStorage.setItem('voxel_player_model', file); } catch (e) {}
  // 既存アバター・ミキサーを破棄
  if (playerAvatar) { scene.remove(playerAvatar); playerAvatar = null; }
  if (mixer) { mixer.stopAllAction(); mixer = null; }
  actIdle = actWalk = actAttack = actSwim = curAction = null; avatarAttackTimer = 0;
  gltfLoader.load(file,
    (gltf) => {
      playerAvatar = gltf.scene;
      playerAvatar.rotation.order = 'YXZ'; // ヨー(向き)→ピッチ(前傾)の順＝うつ伏せ時も頭が進行方向を向く
      playerIsChinchilla = /chinchilla/.test(file);     // チンチラ主人公＝アニメ無し・専用の弾み/スケール
      if (playerIsChinchilla) playerAvatar.scale.setScalar(1.8); // ちょっと大きめの「ヒーローチンチラ」（~1.4m）
      playerAvatar.visible = thirdPerson; // 三人称なら即表示
      scene.add(playerAvatar);
      captureHandRig(); // ★装着リグ(手アンカー/腕回転)を bind pose で採取（mixer 更新前＝中立）。§3 ワールド追従の基準
      let v = 0, mc = 0;
      playerAvatar.traverse(o => { if (o.isMesh) { mc++; const p = o.geometry.getAttribute('position'); if (p) v += p.count; } });
      diag.glb = { tried:true, ok:true, error:null, vertices:v, meshes:mc, clips:[] };
      if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(playerAvatar);
        const byName = {}; gltf.animations.forEach(c => byName[c.name] = c);
        diag.glb.clips = gltf.animations.map(c => c.name);
        actIdle = mixer.clipAction(byName['idle'] || gltf.animations[0]);
        actWalk = mixer.clipAction(byName['walk'] || gltf.animations[1] || (byName['idle'] || gltf.animations[0]));
        if (byName['attack']) { actAttack = mixer.clipAction(byName['attack']); actAttack.loop = THREE.LoopOnce; actAttack.clampWhenFinished = true; } // 攻撃モーション
        if (byName['swim']) actSwim = mixer.clipAction(byName['swim']); // 泳ぎモーション（4号機。あれば前傾の代わりに再生）
        actIdle.play(); curAction = actIdle;
        resetAvatarAnim(); // ★ロード/開始直後は明示的に idle へ（swim 等の引きずりを断つ・星野さん報告の固着対策）
      }
      updateHeldWeapon(); // 装備中の武器/盾を手に反映（読込直後・セーブ復元の武器も）
      console.log(`[voxel] アバター読込 OK(${file})：頂点${v} / clips=[${diag.glb.clips}]`);
    },
    undefined,
    (err) => {
      diag.glb = { tried:true, ok:false, error:String((err && err.message) || err || 'load error'), vertices:0, meshes:0, clips:[] };
      console.warn('[voxel] アバター読込 失敗（未配置なら無視可）:', err);
    }
  );
}

// ===================================================================
// ③ モブのナビゲーション（足場ベース：段差登り・水回避・障害物回避＋簡易A*）
//   ・地表だけでなく洞窟内の足場も歩けるよう、現在高さ付近の「足場」を探す
//   ・陸生モブは水没コラムを避ける（陸生継続）／段差は1上り・3下りまで
// ===================================================================
const STEP_UP = 1, STEP_DOWN = 3; // 登れる/降りられる段差（ブロック）
// (x,z) コラムで refY 付近の足場の高さ（上が空き・下が固体になる y）を返す
function floorYNear(x, z, refY) {
  x = Math.floor(x); z = Math.floor(z);
  const start = Math.min(HEIGHT-1, Math.max(1, Math.floor(refY) + 2));
  for (let y = start; y >= 1; y--) {
    if (isSolid(getBlock(x, y-1, z)) && !isSolid(getBlock(x, y, z))) return y;
  }

    state: opts.state || 'idle', timer: 1+Math.random()*3, vx:0, vz:0, atkCd:0, atkCnt:0,

    // ③ ナビ用：希望進路(navx,navz)・経路再計算CD・徘徊方向(wx,wz)・直近の向き(flx,flz)・スタック計測

      y: Number.isFinite(md.y) ? md.y : undefined,
      ry: Number.isFinite(md.ry) ? md.ry : undefined,
      hp: Number.isFinite(md.hp) ? md.hp : undefined,
      state: md.st,
      home: (md.hm && Number.isFinite(md.hm.x) && Number.isFinite(md.hm.z)) ? md.hm : undefined, // 住人の定住アンカー復元
      companion: md.cp ? true : undefined, cmdMode: md.cm, maxHp: Number.isFinite(md.mhp) ? md.mhp : undefined, // 仲間の復元
      pet: md.pt ? true : undefined, petName: md.pn, traits: (md.ptr ? String(md.ptr).split(',') : undefined), // ペットの復元
      mood: Number.isFinite(md.pmd) ? md.pmd : undefined, petHunger: Number.isFinite(md.phg) ? md.phg : undefined,

function setMobAnim(m, name) {

    : name === 'attack' ? (m.aAttack || m.aWalk || m.aIdle)
    : name === 'heavy' ? (m.aHeavy || m.aAttack || m.aIdle)
    : name === 'hit' ? m.aHit
    : name === 'die' ? m.aDie
    : name === 'talk' ? (m.aTalk || m.aIdle) : m.aIdle;
  if (!target) return;
  if (name === 'hit' || name === 'die') { // 一発再生（先頭から）。idle等へは updateMobs が戻す
    target.reset().play();
    if (m.cur && m.cur !== target) m.cur.fadeOut(0.1);
    m.cur = target;
    return;
  }
  if (target !== m.cur) {
    target.reset().fadeIn(0.15).play();
    if (m.cur) m.cur.fadeOut(0.15);
    m.cur = target;

// ===================================================================
// ④ 昼夜連動の敵スポーン体系
//   ・地上：夜のみ敵性が湧き、朝になると陽光で消滅（プレイヤーから離れた個体）
//   ・地下（洞窟・ダンジョン）：昼夜問わず常時湧き
//   ・カテゴリ別上限（敵性/中立）＋総上限でパフォーマンス管理
// ===================================================================
function sunElev() { return Math.sin(dayTime*Math.PI*2 - Math.PI/2); } // -1(深夜)..1(正午)
function isNight() { return sunElev() < -0.05; }
function isDay()   { return sunElev() > 0.15; }
function playerUnderground() {
  const s = heightAt(Math.floor(player.pos.x), Math.floor(player.pos.z));
  return player.pos.y < s - 2; // 頭が地表より十分下＝洞窟内
}
function isWaterColumnSurface(x, z) { return heightAt(Math.floor(x), Math.floor(z)) <= WATER_LEVEL; }
// 敵性モブを近くに湧かせる（cave=地下の足場へ / 地上はリング状）
function spawnHostileNear(cave) {
  const types = ['weasel', 'bird', 'snake', 'wolf']; // チンチラの天敵（基本の敵）
  if (!cave && Math.random() < 0.12) types.push('golem');         // 地上の夜はまれにボス
  if (!cave && Math.random() < 0.05) types.push('dragon');        // ⑤ さらにまれに上位ボス（ドラゴン）
  if (!cave && Math.random() < 0.03) types.push('skeleton_king'); // ⑤ ボス第2弾（大ボス・最も希少）
  const type = types[Math.floor(Math.random()*types.length)];
  if (!mobTemplates[type]) return;
  const ang = Math.random()*Math.PI*2;
  const dist = cave ? M.caveMin + Math.random()*(M.caveMax-M.caveMin)
                    : M.spawnMin + Math.random()*(M.spawnMax-M.spawnMin);
  const x = player.pos.x + Math.cos(ang)*dist, z = player.pos.z + Math.sin(ang)*dist;
  if (cave) {
    const fy = floorYNear(x, z, player.pos.y);
    const surf = heightAt(Math.floor(x), Math.floor(z));
    if (fy >= surf - 1) return;                                   // 地下でなければ却下
    if (getBlock(Math.floor(x), fy, Math.floor(z)) === B.water) return;
    spawnMob(type, x, z, { y: fy });
  } else {
    if (isWaterColumnSurface(x, z)) return;                       // 水上は不可
    spawnMob(type, x, z);
  }
}
function spawnNeutralNear() {
  // 動物のみ（villager・住人NPCは村/砦に定住／魚は水中専用＝ここ(地上)では湧かせない）
  // ★チンチラだらけ：85%の確率で色違いチンチラ、残りは従来の動物
  const chins  = MOB_DEFS.filter(d => d.chin && mobTemplates[d.type]);
  const others = MOB_DEFS.filter(d => !d.hostile && d.type !== 'villager' && !d.resident && !d.aquatic && !d.petbase && !d.chin && mobTemplates[d.type]);
  let def = null;
  if (chins.length && (Math.random() < 0.85 || !others.length)) def = chins[Math.floor(Math.random()*chins.length)];
  else if (others.length) def = others[Math.floor(Math.random()*others.length)];
  if (!def) return;
  const ang = Math.random()*Math.PI*2, dist = M.spawnMin + Math.random()*(M.spawnMax-M.spawnMin);
  const x = player.pos.x + Math.cos(ang)*dist, z = player.pos.z + Math.sin(ang)*dist;
  if (isWaterColumnSurface(x, z)) return;
  spawnMob(def.type, x, z);
}
function spawnLogic(dt) {
  mobSpawnTimer -= dt;
  if (mobSpawnTimer > 0) return;
  mobSpawnTimer = M.spawnEveryMin + Math.random()*M.spawnEveryRand;
  if (!Object.keys(mobTemplates).length || mobs.length >= M.totalCap) return;
  let hostileN = 0, neutralN = 0, residentN = 0, aquaticN = 0;
  for (const m of mobs) { if (m.hostile) hostileN++; else { neutralN++; if (m.home) residentN++; if (m.def.aquatic) aquaticN++; } }

  if (playerUnderground()) {                       // 地下＝常時、敵性を近接湧き
    if (hostileN < M.hostileCap) spawnHostileNear(true);
    return;
  }
  // 城/砦の駐留兵士（警戒徘徊）。村の住人より先に判定（拠点に居る間は兵士を優先）
  const gar = nearestGarrison(player.pos.x, player.pos.z, 42);
  if (gar && residentN < 6 && Math.random() < 0.6) {
    const types = (gar.captain ? ['soldier_captain','soldier_spear','soldier_sword','soldier_sword']
                               : ['soldier_spear','soldier_sword','guard']).filter(t => mobTemplates[t]);
    const type = types[Math.floor(Math.random()*types.length)];
    if (type) {
      const ang = Math.random()*Math.PI*2, rr = 2 + Math.random()*(gar.r || 5);
      const x = gar.x + Math.cos(ang)*rr, z = gar.z + Math.sin(ang)*rr;
      if (!isWaterColumnSurface(x, z)) spawnMob(type, x, z, { home: { x: gar.x, z: gar.z } });
    }
    return;
  }
  // 海の魚：水辺なら群れで湧く（昼夜問わず・中立）
  if (aquaticN < 6 && Math.random() < 0.5 && spawnFishSchool()) return;
  if (isNight() && hostileN < M.hostileCap && Math.random() < 0.8) { // 地上・夜＝敵性湧き
    spawnHostileNear(false);
    return;
  }
  // 地上＝村が近ければ住人NPCを定住（ただし動物=馬等も湧くよう確率で振り分ける）
  const vil = nearestVillage(player.pos.x, player.pos.z, 50);
  if (vil && residentN < 5 && Math.random() < 0.6) { // 6割住人/4割は下の動物湧きへ
    const pool = ['villager', ...RESIDENT_TYPES].filter(t => mobTemplates[t]);
    const type = pool[Math.floor(Math.random()*pool.length)];
    if (type) {
      const ang = Math.random()*Math.PI*2, rr = 2 + Math.random()*7;
      const x = vil.x + Math.cos(ang)*rr, z = vil.z + Math.sin(ang)*rr;
      if (!isWaterColumnSurface(x, z)) spawnMob(type, x, z, { home: { x: vil.x, z: vil.z } });
    }
    return;
  }
  // 旅の冒険者（道中で仲間にできるNPC）。村/拠点が無い場所でも仲間候補に出会えるよう、たまに近くに湧く。
  //   home=自分の湧き位置にして「その場をうろつく住人AI」に乗せる＝逃げない・話しかけられる・雇える。
  if (!vil && !gar && residentN < 3 && isDay() && Math.random() < 0.4) {
    const pool = ['villager','soldier_spear','soldier_sword','merchant','farmer'].filter(t => mobTemplates[t]);
    const type = pool[Math.floor(Math.random()*pool.length)];
    if (type) {
      const ang = Math.random()*Math.PI*2, rr = 12 + Math.random()*12; // プレイヤーの12〜24m先
      const x = player.pos.x + Math.cos(ang)*rr, z = player.pos.z + Math.sin(ang)*rr;
      if (!isWaterColumnSurface(x, z)) { const m = spawnMob(type, x, z, { home: { x, z } }); if (m) m.traveler = true; }
    }
    return;
  }
  if (neutralN < M.neutralCap) spawnNeutralNear(); // 牛/羊/豚/鶏/馬（村の近くでも湧く）

function updateMobs(dt) {
  // セーブされたモブの復元（テンプレ読込が済んだら1回だけ。完了まで自動湧きは待たせる）
  if (!mobsRestored) {
    if (Object.keys(mobTemplates).length) restorePendingMobs();
    return;
  }
  maybeIntroducePet(); // 🐾 起動後に一度だけペット「さくら」を連れてくる（復元優先・早期return多めで軽量）
  spawnLogic(dt);     // ④ 昼夜・地下を考慮した湧き
  updateSpawners(dt); // ② ダンジョンのスポナー稼働
  updateBossSpots(dt); // ⑥ 城/砦/魔窟のボス出現点
  for (let i = mobs.length-1; i >= 0; i--) {
    const m = mobs[i];
    updateMobFlash(m, dt); // ③ 被弾の白フラッシュ減衰（死亡中も継続）
    // 地中スタック復帰（透明な敵バグ対策）：足元と腹の両方が（プロップ以外の）固体に埋まっていたら
    //   即座に足場へ押し戻す。スポナー/宝箱の上に立つ正常ケースは除外。
    {
      const mx = Math.floor(m.obj.position.x), mz = Math.floor(m.obj.position.z);
      const bf = getBlock(mx, Math.floor(m.obj.position.y + 0.1), mz);
      const bt = getBlock(mx, Math.floor(m.obj.position.y + 1.0), mz);
      const buryF = isSolid(bf) && !isPropBlock(bf), buryT = isSolid(bt) && !isPropBlock(bt);
      m.buried = buryF && buryT;
      if (m.buried) m.obj.position.y = floorYNear(m.obj.position.x, m.obj.position.z, m.obj.position.y);
    }
    // 死亡演出中：AIを止めて die クリップを再生し、終わったら除去
    if (m.dying) {
      m.dieTimer -= dt;
      if (m.mixer) m.mixer.update(dt);
      followFloor(m, dt);
      if (m.dieTimer <= 0) { scene.remove(m.obj); mobs.splice(i,1); }
      continue;
    }
    const dx = player.pos.x - m.obj.position.x, dz = player.pos.z - m.obj.position.z;
    const dist = Math.hypot(dx, dz) || 0.0001;
    const dy = Math.abs(m.obj.position.y - player.pos.y); // 垂直距離。地下/上空に詰まった敵の「見えない攻撃」を遮断する
    if (m.pet) { updatePet(m, dt, dx, dz, dist); if (m.mixer) m.mixer.update(dt); continue; } // 🐾 ペットは despawn しない・専用AI（機嫌/癖）
    if (m.companion) { updateCompanion(m, dt, dx, dz, dist); if (m.mixer) m.mixer.update(dt); continue; } // 仲間は despawn しない・専用AI
    if (dist > M.despawn) { scene.remove(m.obj); mobs.splice(i,1); continue; } // 遠すぎたら消す
    if (m.def.sea) { updateKraken(m, dt, dx, dz, dist); if (m.mixer) m.mixer.update(dt); continue; } // 海ボス専用AI（昼消滅・陸チェイスしない）
    // ④ 朝＝地上の敵性は陽光で消滅（地下の敵は生存＝洞窟は常時湧き）。プレイヤーから離れた個体のみ
    if (m.hostile && isDay() && dist > 18) {
      const surf = heightAt(Math.floor(m.obj.position.x), Math.floor(m.obj.position.z));
      if (m.obj.position.y >= surf - 1) { scene.remove(m.obj); mobs.splice(i,1); continue; }
    }
    if (m.ridden) continue; // 騎乗中の馬はプレイヤー側で制御するためAIスキップ
    // 被弾硬直：短時間 AI を止めて hit クリップを見せる（ノックバック後の「のけぞり」感）
    if (m.hitStun > 0) {
      m.hitStun -= dt;
      followFloor(m, dt);
      if (m.mixer) m.mixer.update(dt);
      continue;
    }
    // 取引中の住人：その場に立ってプレイヤーを向き会話。離れたら解除
    if (m === currentTradeNpc) {
      if (dist > 5) currentTradeNpc = null;

      }
    }

    if (m.def.soldier && m.home && !m.companion) { updateGuard(m, dt); if (m.mixer) m.mixer.update(dt); continue; } // 兵士=駐留地の警備AI（敵に交戦・動物は無視）

    const role = m.def.role;

    let dhx = 0, dhz = 0; // 希望進路（単位ベクトル）

      // スケルトン：間合いを保って矢を撃つ
      if (dist < 7) { dhx = -dx/dist; dhz = -dz/dist; moving = true; animName = 'walk'; } // 近すぎたら下がる
      else {
        m.obj.rotation.y = Math.atan2(-dx, -dz); animName = 'attack';
        m.atkCd -= dt;
        if (m.atkCd <= 0) { m.atkCd = C.arrowCd; shootArrow(m.obj.position.x, m.obj.position.y+1.2, m.obj.position.z, player.pos.x, player.pos.y+0.9, player.pos.z); }
      }
    } else if (role === 'boss' && dist < 26) {
      // ゴーレム：遅い接近（経路探索）＋強攻撃(heavy)。高低差が大きい時は攻撃せず接近を試みる（不可視攻撃の遮断）
      if (dist > 2.2 || dy > 2.5) { const h = chaseHeading(m, dt); dhx = h.x; dhz = h.z; moving = true; animName = 'walk'; }
      else {
        m.obj.rotation.y = Math.atan2(-dx, -dz);
        m.atkCd -= dt; animName = 'attack';
        if (m.atkCd <= 0) {
          m.atkCnt++;
          if (m.atkCnt % 3 === 0) { // 強攻撃(heavy)
            m.atkCd = C.golemHeavyCd; animName = 'heavy';
            if (m.def.queen) { // ★女王さくらの「おしっこ攻撃」：範囲大ダメージ＋スリップ＋黄色い飛沫
              damage(C.golemHeavyDmg * 3, 'sakura');
              playerSlow = 4;                                  // 4秒スリップ（移動速度低下）
              spawnSplash(player.pos.x, player.pos.y + 0.4, player.pos.z, 18);
              camShake = Math.max(camShake, 0.6);
            } else damage(C.golemHeavyDmg, 'golem');
          } else { m.atkCd = C.golemCd; damage(m.def.queen ? C.golemDmg + 2 : C.golemDmg, 'golem'); }
        }
      }
    } else if (role === 'melee' && dist < 20) {
      if (dist > 1.4 || dy > 2.5) { const h = chaseHeading(m, dt); dhx = h.x; dhz = h.z; moving = true; animName = 'walk'; } // 経路探索で追跡（高低差大なら接近優先＝不可視攻撃を遮断）
      else { m.obj.rotation.y = Math.atan2(-dx, -dz); animName = 'attack'; m.atkCd -= dt; if (m.atkCd <= 0) { m.atkCd = C.meleeCd; damage(C.meleeDmg, 'mob'); } }
    } else if (role === 'neutral' && dist < 5 && !m.home && !m.def.ally) {

    } else if (m.home) {
      // 住人NPCの生活AI：昼=仕事場周辺(半径12)を徘徊／夜=home(村中心・半径3)へ帰る
      const hx = m.home.x - m.obj.position.x, hz = m.home.z - m.obj.position.z, hd = Math.hypot(hx, hz) || 1;
      const radius = isNight() ? 3 : 12;
      if (hd > radius) { dhx = hx/hd; dhz = hz/hd; moving = true; animName = 'walk'; }
      else { const fh = flockHeading(m, dt); if (m.state === 'walk' && fh) { dhx = fh.x; dhz = fh.z; moving = true; animName = 'walk'; } else { moving = false; animName = 'idle'; } }
    } else {
      const fh = flockHeading(m, dt); // 動物は群れ＋徘徊
      if (m.state === 'walk' && fh) { dhx = fh.x; dhz = fh.z; moving = true; animName = 'walk'; }
      else { moving = false; animName = 'idle'; }
    }
    if (moving) {
      const spd = role === 'boss' ? M.speedBoss : m.hostile ? M.speedHostile : (m.def.type === 'villager' ? M.speedVillager : M.speedNeutral);
      const ok = tryMoveMob(m, dhx, dhz, spd, dt);
      if (!ok) { // 行き止まり：経路を引き直し、徘徊中なら一旦停止して向きを変える
        m.stuck += dt; m.navCd = 0; animName = 'idle';
        if (!m.hostile && m.stuck > 1.0) { m.state = 'idle'; m.timer = 0.3; m.stuck = 0; }
      } else m.stuck = 0;

      followFloor(m, dt); // 静止時も足場へ吸着

    // アニメ無しの生き物（チンチラ/天敵/仲間）はコードで軽くぴょこぴょこ（スライド移動を防ぐ）
    if (m.def.chin || m.def.critter) {
      m.hopT = (m.hopT || 0) + dt * (animName === 'walk' ? 9 : 4);
      const cfy = floorYNear(m.obj.position.x, m.obj.position.z, m.obj.position.y);
      m.obj.position.y = cfy + Math.max(0, Math.sin(m.hopT)) * (m.def.type === 'snake' ? 0.02 : 0.06);

function nearestVillage(px, pz, maxD) {
  let best = null, bd = maxD;
  for (const v of villages.values()) {
    const d = Math.hypot(v.x - px, v.z - pz);
    if (d < bd) { bd = d; best = v; }
  }
  return best;
}
// 最寄りの駐留地（城/砦・半径 maxD 内）を返す
function nearestGarrison(px, pz, maxD) {
  let best = null, bd = maxD;
  for (const g of garrisons.values()) {
    const d = Math.hypot(g.x - px, g.z - pz);
    if (d < bd) { bd = d; best = g; }
  }
  return best;
}
// 8方位コンパス（北=-Z基準＝プレイヤー正面方向）。診断ナビ用。
function compass8(dx, dz) {
  const dirs = ['北','北東','東','南東','南','南西','西','北西'];
  let a = Math.atan2(dx, -dz);                 // -Z を北(0)・+X を東(π/2)
  if (a < 0) a += Math.PI * 2;
  return dirs[Math.round(a / (Math.PI/4)) % 8];
}
// 決定論的に最寄りの構造物中心を探す（チャンク未生成でも hash で位置が分かる＝探索ナビ）。
//   ※「最寄り乗れる船」と同じ発想で、星野さんが王国城/ダンジョンの方向と距離を一目で分かるように。
function nearestDeterministic(px, pz, cell, span, place) {
  let best = null, bd = Infinity;
  const gx0 = Math.floor(px/cell), gz0 = Math.floor(pz/cell);
  for (let gx = gx0-span; gx <= gx0+span; gx++) for (let gz = gz0-span; gz <= gz0+span; gz++) {
    const c = place(gx, gz, cell);              // gate＋生成条件を満たす中心 {x,z,...} または null
    if (!c) continue;
    const d = Math.hypot(c.x - px, c.z - pz);
    if (d < bd) { bd = d; best = Object.assign({}, c, { d }); } // 追加フィールド(floorY/surf 等)も保持
  }
  return best;
}
// 王国城セルの中心（buildStructures の城ループと同一の判定）。条件を満たさなければ null。
function castleCenter(gx, gz, cell) {
  if (hash2(gx*131+19, gz*131+41) > 0.42) return null;
  const ox = gx*cell + 20 + Math.floor(hash2(gx+17, gz+23) * (cell-40));
  const oz = gz*cell + 20 + Math.floor(hash2(gx+29, gz+11) * (cell-40));
  const bi = biomeAt(ox, oz);
  if (bi !== 'plains' && bi !== 'snow') return null;
  if (heightAt(ox, oz) <= WATER_LEVEL + 1) return null;
  return { x: ox, z: oz };
}
// ダンジョンセルの中心（buildStructures のダンジョンループ＋buildDungeon の生成条件と*完全に同一*）。
//   ★buildDungeon は floor=地表-9 が y<4（地表<13）だと生成しない。ナビもこの却下を再現しないと
//     「0m と言うのに実体が無い」食い違いになる（星野さん報告の根治）。生成された場合だけ返す。
function dungeonCenter(gx, gz, cell) {
  if (hash2(gx*29+5, gz*29+11) > 0.28) return null;
  const ox = gx*cell + 10 + Math.floor(hash2(gx+7, gz+1) * (cell-20));
  const oz = gz*cell + 10 + Math.floor(hash2(gx+4, gz+8) * (cell-20));
  const surf = heightAt(ox, oz), floorY = surf - 9;
  if (floorY < 4) return null;                 // ★buildDungeon の「浅すぎる地形は不可」と同条件＝実体のある所だけ
  return { x: ox, z: oz, surf, floorY };        // floorY=床 / surf=地表（地下なので掘る目安に使う）
}
// 魔窟ダンジョン（デーモン）の「地上の階段口」をナビ用に返す。魔窟でなければ null。生成(buildDungeon)と同一判定。
function dungeonLairMouth(gx, gz, cell) {
  const c = dungeonCenter(gx, gz, cell);
  if (!c || !dungeonIsLair(c.x, c.z)) return null;
  const R = 4, drop = c.surf - (c.floorY + 1); // 魔窟は R=4。階段は +X に R+drop 伸び、口は地表
  return { x: c.x + R + drop, z: c.z, surf: c.surf }; // mouth=地上の階段口（ここへ向かえば歩いて降りられる）
}
function navLine(px, pz, info, opts) { // 距離+方角+座標（opts.depth なら地下の掘り下げ目安も）
  if (!info) return '探索範囲に未検出';
  const onTop = info.d < 2; // ほぼ真上に立っている
  let s = `${info.d.toFixed(0)}m ${compass8(info.x-px, info.z-pz)}（${info.x.toFixed(0)},${info.z.toFixed(0)}）`;
  if (opts && opts.depth && typeof info.floorY === 'number') {
    // ダンジョンは地下。天井=床+4=地表-5。真上に立っていれば「真下を掘る」目安を出す。
    const ceil = info.floorY + 4, digFromFeet = Math.max(0, Math.round(player.pos.y - ceil));
    s += ` ／ 地下:床Y${info.floorY}・天井Y${ceil}（地表Y${info.surf}）`;
    s += onTop ? ` → 真下を約${digFromFeet}ブロック掘る` : ' → 真上まで行って掘り下げる';
  }
  return s;
}
// ⑥ ボス出現点：プレイヤー接近で守護ボスを1体出現。撃破/離脱後に再武装（クールダウン付き）。
//   モデル未読込(demon 等)の type は静かにスキップ＝モデル到着で自動有効化。
function updateBossSpots(dt) {
  if (mobs.length >= M.totalCap) return;
  for (const s of bossSpots.values()) {
    const d = Math.hypot(s.x - player.pos.x, s.z - player.pos.z) + Math.abs(s.y - player.pos.y) * 0.5;
    if (d > 80) { s.mob = null; continue; }                 // 遠方で再武装
    if (s.mob && mobs.includes(s.mob) && !s.mob.dying) continue; // 生存中はスキップ
    if (d > (s.trig || 22)) continue;                       // 接近で起動
    s.cd -= dt;
    if (s.cd > 0) continue;
    s.cd = 30;                                              // 連続湧き防止
    if (!mobTemplates[s.type]) continue;                    // モデル未読込（demon 等）は静かにスキップ
    s.mob = spawnMob(s.type, s.x, s.z, { y: s.y });
  }
}
// ④ 海の魚：水辺で群れ(3〜5匹)を湧かせる（中立・水中専用AI）。湧けたら true
function spawnFishSchool() {
  const fishTypes = MOB_DEFS.filter(d => d.aquatic && mobTemplates[d.type]);
  if (!fishTypes.length) return false;
  for (let tries = 0; tries < 6; tries++) {
    const ang = Math.random()*Math.PI*2, dist = M.spawnMin + Math.random()*(M.spawnMax-M.spawnMin);
    const cx = player.pos.x + Math.cos(ang)*dist, cz = player.pos.z + Math.sin(ang)*dist;
    if (heightAt(Math.floor(cx), Math.floor(cz)) > WATER_LEVEL - 2) continue; // 十分な水深がない
    const def = fishTypes[Math.floor(Math.random()*fishTypes.length)];
    const n = 3 + Math.floor(Math.random()*3); // 3〜5匹の群れ
    let spawned = 0;
    for (let i = 0; i < n && mobs.length < M.totalCap; i++) {
      const fx = cx + (Math.random()*4-2), fz = cz + (Math.random()*4-2);
      const sea = heightAt(Math.floor(fx), Math.floor(fz));
      if (sea > WATER_LEVEL - 1) continue;
      const y = sea + 0.8 + Math.random()*Math.max(0.4, WATER_LEVEL - sea - 1.4); // 海底+0.8〜水面下
      const m = spawnMob(def.type, fx, fz, { y });
      if (m) { m.fishYaw = Math.random()*Math.PI*2; m.fishRise = 0; m.timer = Math.random()*2; spawned++; }
    }
    return spawned > 0;
  }
  return false;
}
// ④ 魚の遊泳AI：水中をゆっくり巡り、水から出ない・海底に潜らない。たまに向き/上下を変える。
function updateFishAI(m, dt) {
  m.timer -= dt;
  if (m.timer <= 0) { m.timer = 1.5 + Math.random()*3; m.fishYaw = (m.fishYaw||0) + (Math.random()*2-1)*1.2; m.fishRise = (Math.random()*2-1)*0.25; }
  const yaw = m.fishYaw || 0, spd = 1.0;
  const nx = m.obj.position.x - Math.sin(yaw)*spd*dt; // 正面 -Z 基準（mob と同じ向き規約）
  const nz = m.obj.position.z - Math.cos(yaw)*spd*dt;
  const sea = heightAt(Math.floor(nx), Math.floor(nz));
  if (sea > WATER_LEVEL - 1) { m.fishYaw = yaw + Math.PI + (Math.random()*0.6-0.3); } // 陸/浅瀬へ向かったら反転
  else {
    let ny = m.obj.position.y + (m.fishRise||0)*dt;
    ny = Math.max(sea + 0.7, Math.min(WATER_LEVEL - 0.4, ny)); // 海底+0.7〜水面下0.4 に収める
    m.obj.position.set(nx, ny, nz);
    m.obj.rotation.y = yaw;
  }
  setMobAnim(m, 'walk'); // swim クリップ（aWalk に swim をマップ済み）
  if (m.mixer) m.mixer.update(dt);
}
// ② ダンジョンのスポナー：近くにプレイヤーが居ると敵を周期的に湧かせる（昼夜問わず＝地下は暗い）
function updateSpawners(dt) {
  if (mobs.length >= M.totalCap) return;
  for (const [key, s] of spawners) {
    // 水平距離＋高さ差で近接判定（地上を歩くだけでは作動しにくく、潜ると作動）
    const d = Math.hypot(s.x - player.pos.x, s.z - player.pos.z) + Math.abs(s.y - player.pos.y) * 0.6;
    if (d > 16) continue;
    if (getBlock(s.x, s.y, s.z) !== B.spawner) { spawners.delete(key); continue; } // 破壊済みなら除去
    s.cd -= dt;
    if (s.cd <= 0 && mobs.length < M.totalCap) {
      s.cd = 6 + Math.random()*4;
      const type = ['weasel', 'snake', 'bird', 'wolf'][Math.floor(Math.random()*4)]; // 巣穴から天敵が湧く
      if (mobTemplates[type]) spawnMob(type, s.x + (Math.random()*2-1), s.z + (Math.random()*2-1), { y: s.y });
    }
  }
}

// 矢（スケルトンの遠距離攻撃）
const arrows = [];
const arrowGeo = new THREE.BoxGeometry(0.08, 0.08, 0.6);
const arrowMat = new THREE.MeshBasicMaterial({ color: 0x2b2b2b });
// 汎用の矢生成（friendly=true なら味方の矢＝モブに当たる / false は敵の矢＝プレイヤーに当たる）
function shootArrowEx(fx, fy, fz, dx, dy, dz, speed, friendly, dmg, isCrit) {
  const d = Math.hypot(dx, dy, dz) || 1;
  const obj = new THREE.Mesh(arrowGeo, arrowMat);
  obj.position.set(fx, fy, fz); obj.lookAt(fx + dx, fy + dy, fz + dz);
  scene.add(obj);
  arrows.push({ obj, vx: dx/d*speed, vy: dy/d*speed, vz: dz/d*speed, life: 3, friendly: !!friendly, dmg: dmg || C.arrowDmg, isCrit: !!isCrit });
}
// 敵モブ → プレイヤー狙いの矢（既存呼出の互換）
function shootArrow(fx, fy, fz, tx, ty, tz) {
  shootArrowEx(fx, fy, fz, tx-fx, ty-fy, tz-fz, C.arrowSpeed, false, C.arrowDmg, false);
  window.playSFX && window.playSFX('attack');
}
function updateArrows(dt) {
  for (let i = arrows.length-1; i >= 0; i--) {
    const a = arrows[i];
    a.vy -= 6 * dt; // 軽い重力で弧を描く
    a.obj.position.x += a.vx*dt; a.obj.position.y += a.vy*dt; a.obj.position.z += a.vz*dt;
    a.life -= dt;
    let consumed = false;
    if (a.friendly) { // 味方の矢：モブに命中
      for (let j = mobs.length-1; j >= 0; j--) {
        const m = mobs[j]; if (m.dying || m.pet) continue; // 🐾 ペットには味方の矢も当たらない
        const p = m.obj.position;
        const dd = (a.obj.position.x-p.x)**2 + (a.obj.position.y-(p.y+0.7))**2 + (a.obj.position.z-p.z)**2;
        if (dd < 0.8) { hitMob(m, a.dmg, a.isCrit, 'bow', 0, a.vx, a.vz, WEAPONS.bow.knock); scene.remove(a.obj); arrows.splice(i,1); consumed = true; break; }
      }
    } else { // 敵の矢：プレイヤーに命中
      const px = player.pos.x, py = player.pos.y+0.9, pz = player.pos.z;
      const dd = (a.obj.position.x-px)**2 + (a.obj.position.y-py)**2 + (a.obj.position.z-pz)**2;
      if (dd < 0.64) { damage(a.dmg, 'arrow'); window.playSFX && window.playSFX('hit'); scene.remove(a.obj); arrows.splice(i,1); consumed = true; }
    }
    if (consumed) continue;
    if (a.life <= 0 || a.obj.position.y < groundY(a.obj.position.x, a.obj.position.z) - 1) { scene.remove(a.obj); arrows.splice(i,1); } // 期限・着地
  }
}

const fxList = []; // { obj, mixer, life }

  const obj = tpl.scene.clone(true);

  if (scale) obj.scale.setScalar(scale);

  let mixer = null;

function updateFx(dt) {

}

const PROP_VIEW = 34;            // この距離内のプロップだけ GLB を生成（負荷管理）
const PROP_SCAN_INTERVAL = 0.25; // 全プロップの距離スキャンの間隔（秒）。毎フレーム全件走査しない
const activeProps = [];          // 現在GLB表示中のプロップ（mixer更新を毎フレーム回す対象）
let propScanTimer = 0;
// 表示中プロップのアニメは毎フレーム、生成/破棄の判定は間引いて実行（プロップ大量時のフレーム落ち防止）
function updateProps(dt) {
  for (let i = 0; i < activeProps.length; i++) if (activeProps[i].mixer) activeProps[i].mixer.update(dt);
  propScanTimer -= dt;
  if (propScanTimer > 0) return;
  propScanTimer = PROP_SCAN_INTERVAL;
  scanProps();
}
function scanProps() {
  activeProps.length = 0;
  for (const [k, p] of props) {
    // 宝箱/スポナーはブロックが破壊されたら除去（開封・破壊で消える）
    if (p.kind === 'chest' && getBlock(p.x, p.y, p.z) !== B.chest && !p.opened) { disposeProp(p); props.delete(k); continue; }
    if (p.kind === 'spawner' && getBlock(p.x, p.y, p.z) !== B.spawner) { disposeProp(p); props.delete(k); continue; }
    const d = Math.hypot(p.x + 0.5 - player.pos.x, p.z + 0.5 - player.pos.z) + Math.abs(p.y - player.pos.y) * 0.5;
    if (d > PROP_VIEW) { if (p.obj) disposeProp(p); continue; }
    if (!p.obj) {
      const tpl = structTemplates[p.kind];
      if (!tpl) continue; // テンプレ未読込
      const obj = tpl.scene.clone(true);
      obj.position.set(p.x + 0.5, p.y, p.z + 0.5);
      if (p.ry) obj.rotation.y = p.ry;
      scene.add(obj);
      p.obj = obj;
      if (tpl.animations.length) {
        p.mixer = new THREE.AnimationMixer(obj);
        const byName = {}; tpl.animations.forEach(c => byName[c.name] = c);
        p.actIdle = p.mixer.clipAction(byName['idle'] || tpl.animations[0]);
        if (byName['open']) { p.actOpen = p.mixer.clipAction(byName['open']); p.actOpen.clampWhenFinished = true; p.actOpen.loop = THREE.LoopOnce; }
        if (p.opened && p.actOpen) { p.actOpen.play(); p.actOpen.time = p.actOpen.getClip().duration; } // 既に開封済みなら開状態で
        else p.actIdle.play();
      }
    }
    if (p.obj) activeProps.push(p);
  }
}
function disposeProp(p) { if (p.obj) { scene.remove(p.obj); p.obj = null; p.mixer = null; p.actIdle = null; p.actOpen = null; } }
// 宝箱プロップを開アニメで開く（openChest から呼ぶ）
function openChestProp(x, y, z) {
  const p = props.get(`${x},${y},${z}`);
  if (!p || p.kind !== 'chest') return;
  p.opened = true;
  if (p.actOpen) { p.actOpen.reset().play(); if (p.actIdle) p.actIdle.stop(); }
}

// 装備品を地面にドロップ（拾うと grantEquip）
function spawnEquipDrop(kind, x, y, z) {
  const tpl = equipTemplates[kind];
  if (!tpl) { grantEquip(kind); return; } // モデル未読込なら即入手
  const obj = tpl.clone(true);
  obj.scale.setScalar(0.8);
  obj.position.set(x, y + 0.5, z);
  scene.add(obj);
  drops.push({ obj, equip: kind, t: Math.random()*Math.PI*2, life: 180 });
}
// 敵撃破時の装備ドロップ抽選（敵性ほど良い物が出やすい）
function maybeDropEquip(m) {
  const r = Math.random();
  const chance = m.def.role === 'boss' ? 0.9 : m.hostile ? 0.14 : 0.03;
  if (r > chance) return;
  const pool = m.def.role === 'boss' ? ['armor','shield','sword','axe','bow']
    : ['sword','axe','bow','pickaxe','shield','armor'];
  const kind = pool[Math.floor(Math.random()*pool.length)];
  spawnEquipDrop(kind, m.obj.position.x, m.obj.position.y, m.obj.position.z);
}
// プレイヤーの攻撃間合い/攻撃力は CFG.combat（C.playerReach / C.playerDmg）

function spawnDrop(item, x, y, z) {
  if (!item) return;
  const tpl = itemTemplates[item];
  if (!tpl) { itemCounts[item] = (itemCounts[item]||0) + 1; scheduleSave(); return; } // テンプレ無ければ即入手
  const obj = tpl.clone(true);
  obj.scale.setScalar(0.6);
  obj.position.set(x, y + 0.4, z);
  scene.add(obj);
  drops.push({ obj, item, t: Math.random()*Math.PI*2, life: 120 });
}
function updateDrops(dt) {
  for (let i = drops.length-1; i >= 0; i--) {
    const d = drops[i];
    d.t += dt*2; d.obj.rotation.y += dt*1.5; d.obj.position.y += Math.sin(d.t)*0.003; // 回転＋ふわふわ
    d.life -= dt;
    const dx = player.pos.x-d.obj.position.x, dy = (player.pos.y+0.8)-d.obj.position.y, dz = player.pos.z-d.obj.position.z;
    if (dx*dx+dy*dy+dz*dz < 1.7*1.7) { // 近づくと拾う
      if (d.equip) { grantEquip(d.equip); }           // 装備品 → 所持＆装備
      else { itemCounts[d.item] = (itemCounts[d.item]||0) + 1; window.playSFX && window.playSFX('pickup'); }
      scene.remove(d.obj); drops.splice(i,1); scheduleSave(); continue;
    }
    if (d.life <= 0) { scene.remove(d.obj); drops.splice(i,1); } // 時間切れで消滅
  }
}

// 攻撃アクション（攻撃モーション・入力バッファ・コンボ・溜め・武器種・扇形マルチヒット・
//   ヒットストップ・ノックバック・被弾/死亡アニメ）。連携口は宣言済みの契約に準拠

// 武器・装備の状態は上方（loadWorld前）で宣言済み。ここからは攻撃の挙動

let attackBuffered = false; // 振り中に押された次の入力
let comboIndex = 0, comboTimer = 0; // 3連コンボ（3発目が会心）

const CHARGE_FULL = 0.85;  // 弓のフル溜め秒
const COMBO_WINDOW = 0.9;  // 連撃が繋がる猶予秒

function cycleWeapon() {
  const list = WEAPON_ORDER.filter(w => ownedWeapons.has(w)); // 所持武器だけ巡回
  if (!list.length) return;
  const i = list.indexOf(currentWeapon);
  currentWeapon = list[(i + 1) % list.length];
  emitEquipChange(); updateHeldWeapon();
}

// 装備：防御計算・入手・連携口（宣言済み契約に準拠）
// ===================================================================
function armorCount() { return (equip.armor.head?1:0) + (equip.armor.body?1:0) + (equip.armor.legs?1:0); }
function defenseFactor() { // 被ダメ軽減 0..cap
  return Math.min(C.defenseCap, armorCount() * C.armorPerPiece + (equip.shield ? C.shieldDef : 0) + (hasSakuraCape ? 0.1 : 0)); // さくらの毛皮マント=防御+10%
}
function equipState() {
  return { weapon: currentWeapon, ownedWeapons: [...ownedWeapons],
    armor: { ...equip.armor }, shield: equip.shield, defense: defenseFactor() };
}
function emitEquipChange() {
  if (typeof window.onEquipChange === 'function') { try { window.onEquipChange(equipState()); } catch (e) {} }
}
// 装備品の入手（拾う＝所持＆自動装備）。kind: 武器名 / 'armor' / 'shield'
function grantEquip(kind) {
  if (WEAPONS[kind]) { ownedWeapons.add(kind); currentWeapon = kind; toast(`${WEAPONS[kind].name} を入手・装備`); }
  else if (kind === 'shield') { equip.shield = true; ownedShield = true; toast('盾 を装備'); }
  else if (kind === 'armor') {
    const slot = !equip.armor.head ? 'head' : !equip.armor.body ? 'body' : !equip.armor.legs ? 'legs' : null;
    if (slot) { equip.armor[slot] = true; toast(`防具(${slot}) を装備`); }
    else { toast('防具はすべて装備済み'); return; }
  } else return;
  window.playSFX && window.playSFX('equip');
  emitEquipChange(); updateHeldWeapon(); scheduleSave();
}
// UIから叩く操作口
window.getEquipment = () => equipState();
window.equipWeapon = (type) => { if (!ownedWeapons.has(type) || !WEAPONS[type]) return false; currentWeapon = type; emitEquipChange(); updateHeldWeapon(); return true; };
window.toggleShield = () => { if (!ownedShield) return false; equip.shield = !equip.shield; window.playSFX && window.playSFX('equip'); emitEquipChange(); updateHeldShield(); scheduleSave(); return equip.shield; };
window.unequipArmor = (slot) => { if (equip.armor[slot]) { equip.armor[slot] = false; emitEquipChange(); scheduleSave(); return true; } return false; };
// 手持ち表示の実測口（3号機のequip確認overlay・自動検証用）。装着中の剣/盾のworld位置と向きを返す
window.getHeldDebug = () => {
  const info = (obj) => {
    if (!obj || !obj.parent) return null;
    const p = obj.getWorldPosition(new THREE.Vector3());
    const q = obj.getWorldQuaternion(new THREE.Quaternion());
    const up    = new THREE.Vector3(0, 1, 0).applyQuaternion(q);  // モデル+Y（剣=刃の向き）
    const front = new THREE.Vector3(0, 0, -1).applyQuaternion(q); // モデル-Z（盾=面の向き）
    const r2 = v => [+v.x.toFixed(2), +v.y.toFixed(2), +v.z.toFixed(2)];
    return { pos: r2(p), up: r2(up), front: r2(front) };
  };
  const r2 = v => [+v.x.toFixed(2), +v.y.toFixed(2), +v.z.toFixed(2)];
  const avatarPos = playerAvatar ? playerAvatar.getWorldPosition(new THREE.Vector3()) : null;
  // player=本体座標 / avatar=アバターのworld座標 を併記（武器/盾pos と比較し、追従の有無を一目で判定）
  return { weapon: currentWeapon, shieldOn: !!equip.shield, player: r2(player.pos), avatar: avatarPos ? r2(avatarPos) : null, sword: info(heldWeapon), shield: info(heldShield) };
};

// 採掘素材→装備のクラフト（鉱石と装備システムを連結）。mats=itemCounts素材 / blocks=設置ブロック
const EQUIP_RECIPES = [
  { id:'pickaxe', name:'ピッケル', kind:'pickaxe', mats:{ iron:2 }, blocks:{ [B.planks]:2 } },
  { id:'sword',   name:'剣',       kind:'sword',   mats:{ iron:2 }, blocks:{ [B.planks]:1 } },
  { id:'axe',     name:'斧',       kind:'axe',     mats:{ iron:3 }, blocks:{ [B.planks]:2 } },
  { id:'bow',     name:'弓',       kind:'bow',     mats:{},          blocks:{ [B.planks]:3 } },
  { id:'shield',  name:'盾',       kind:'shield',  mats:{ iron:1 },  blocks:{ [B.planks]:3 } },
  { id:'armor',   name:'防具1枚',  kind:'armor',   mats:{ iron:3 },  blocks:{} },
  // ②段階強化（前段の所持が条件 req）。鉄の剣→鋼の剣→金の剣。威力 5→8→13。
  { id:'steel_sword', name:'鋼の剣（剣を強化）', kind:'steel_sword', req:'sword',       mats:{ iron:4, coal:2 },  blocks:{} }, // 石炭=製鋼の燃料（石炭の用途）
  { id:'gold_sword',  name:'金の剣（鋼を強化）', kind:'gold_sword',  req:'steel_sword', mats:{ gold:3, iron:2 },  blocks:{} },
];
function canCraftEquip(r) {
  if (!r) return false;
  for (const k in r.mats)   if ((itemCounts[k]||0) < r.mats[k])   return false;
  for (const b in r.blocks) if ((counts[b]||0)     < r.blocks[b]) return false;
  if (r.req && !ownedWeapons.has(r.req)) return false;                            // ②段階強化：前段の武器を所持していること
  if (WEAPONS[r.kind] && ownedWeapons.has(r.kind)) return false;                  // 既所持の武器は不要
  if (r.kind === 'shield' && ownedShield) return false;                           // 盾は1つで十分
  if (r.kind === 'armor' && equip.armor.head && equip.armor.body && equip.armor.legs) return false; // 防具枠満杯
  return true;
}
function craftEquip(id) {
  const r = EQUIP_RECIPES.find(x => x.id === id);
  if (!canCraftEquip(r)) return false;
  for (const k in r.mats)   itemCounts[k] -= r.mats[k];
  for (const b in r.blocks) counts[b]     -= r.blocks[b];
  grantEquip(r.kind);                       // 所持＆装備＋通知＋保存
  updateHotbar(); window.playSFX && window.playSFX('craft');
  return true;
}
window.VoxelGame.craftEquip = (id) => craftEquip(id);

// NPC会話/取引（4号機 talkクリップ＋3号機 取引UI に接続）
//   give/get は itemCounts キー（coin/apple/meat/egg/coal/iron/gold）。equip は装備を付与
// ===================================================================
const TRADE_TABLE = {
  merchant:   [ {give:{coin:3},get:{apple:2}}, {give:{coin:4},get:{meat:2}}, {give:{apple:3},get:{coin:5}}, {give:{egg:4},get:{coin:6}} ],
  blacksmith: [ {give:{iron:2},equip:'sword'}, {give:{iron:4},equip:'steel_sword'}, {give:{gold:3},equip:'gold_sword'}, {give:{iron:2},equip:'pickaxe'}, {give:{iron:3},equip:'axe'}, {give:{iron:3},equip:'armor'}, {give:{gold:4},equip:'shield'} ],
  farmer:     [ {give:{coin:2},get:{apple:3}}, {give:{apple:2},get:{coin:3}}, {give:{coin:3},get:{egg:2}} ],
  baker:      [ {give:{coin:3},get:{meat:2}}, {give:{coin:2},get:{apple:2}} ],
  default:    [ {give:{coin:2},get:{apple:1}}, {give:{apple:2},get:{coin:3}} ],
};
const NPC_GREETING = { merchant:'いい品揃えだよ、見ていきな', blacksmith:'鉄はあるか？武器を打つぜ', farmer:'作物と交換しないか', baker:'焼きたてだよ！', guard:'通行人か、気をつけてな', elder:'よく来たな、若いの', child:'わー、ぼうけんしゃだ！', woman:'こんにちは', villager:'やあ',
  rabbit:'いっしょに行こう！', guineapig:'ぷぷっ（仲間にして）', squirrel:'木の実あげる！', hedgehog:'前は任せて！' };
const JOB_LABEL = { merchant:'商人', blacksmith:'鍛冶屋', farmer:'農民', baker:'パン屋', guard:'衛兵', elder:'長老', child:'子供', woman:'住人', villager:'村人', soldier_spear:'槍兵', soldier_sword:'剣兵', soldier_captain:'隊長',
  rabbit:'うさぎ', guineapig:'モルモット', squirrel:'リス', hedgehog:'ハリネズミ' };
let currentTradeNpc = null;
function equipDisplayName(kind) { return (WEAPONS[kind] && WEAPONS[kind].name) || (kind === 'armor' ? '防具' : kind === 'shield' ? '盾' : kind); }
function buildTradeSession(m) {
  const job = m.def.type;
  const table = TRADE_TABLE[job] || TRADE_TABLE.default;
  const offers = table.map((o, i) => {
    const gk = Object.keys(o.give)[0], gn = o.give[gk];
    const getKey = o.equip || Object.keys(o.get)[0];
    return {
      id: i,
      giveName: ITEM_NAMES[gk] || gk, giveIcon: 'item_' + gk, giveCount: gn,
      getName: o.equip ? equipDisplayName(o.equip) : (ITEM_NAMES[getKey] || getKey),
      getIcon: 'item_' + getKey, getCount: o.equip ? 1 : o.get[getKey],
      canAfford: (itemCounts[gk] || 0) >= gn,
    };
  });
  // 仲間化の可否（3号機UIが「仲間にする(◯coin)」ボタンを出す用）
  const recruit = {
    cost: COMPANION_COST,
    already: !!m.companion,
    full: companions.length >= MAX_COMPANIONS,
    canRecruit: !m.companion && companions.length < MAX_COMPANIONS && (itemCounts.coin || 0) >= COMPANION_COST,
  };
  return { npc: JOB_LABEL[job] || '住人', job, greeting: NPC_GREETING[job] || '…', offers, recruit };
}
// 会話中の住人を雇って仲間にする（3号機UIの「仲間にする」ボタン→ VoxelGame.recruit）
window.VoxelGame.recruit = () => {
  const m = currentTradeNpc;
  if (!m || (!m.home && !m.def.ally) || m.companion) return false;      // 会話中の住人 or 味方動物（未仲間）
  if (companions.length >= MAX_COMPANIONS) { if (typeof toast==='function') toast(`仲間は満員（最大${MAX_COMPANIONS}人）`); return false; }
  if ((itemCounts.coin || 0) < COMPANION_COST) { if (typeof toast==='function') toast(`コインが足りない（${COMPANION_COST}枚必要）`); return false; }
  itemCounts.coin -= COMPANION_COST;
  m.companion = true; m.cmdMode = 'follow'; m.home = null; m.hostile = false;
  m.maxHp = COMPANION_HP; m.hp = COMPANION_HP; m.cid = ++companionIdSeq;
  companions.push(m); attachAllyMarker(m);
  try { window.onCompanionJoin && window.onCompanionJoin(m.def.type); } catch (e) {}
  if (typeof toast === 'function') toast(`${JOB_LABEL[m.def.type]||'住人'}が仲間になった！（追従）`);
  updateHotbar(); scheduleSave();
  return buildTradeSession(m); // 更新後セッションを返してUI再描画
};
// 仲間への指示（id省略=全員）。mode='follow'|'wait'|'attack'。解雇は mode='dismiss'。
window.VoxelGame.commandCompanion = (id, mode) => {
  if (mode === 'dismiss') { (id==null?[...companions]:companions.filter(c=>c.cid===id)).forEach(c => leaveCompanion(c, 'dismiss')); return true; }
  if (!['follow','wait','attack'].includes(mode)) return false;
  const list = (id == null) ? companions : companions.filter(c => c.cid === id);
  list.forEach(c => c.cmdMode = mode);
  if (typeof toast === 'function') toast(`仲間: ${mode==='follow'?'追従':mode==='wait'?'待機':'攻撃'}`);
  scheduleSave();
  return true;
};
// 取引実行（3号機UIのボタンから）。在庫増減→更新後セッションを返して再描画させる
window.VoxelGame.trade = (offerId) => {
  if (!currentTradeNpc) return null;
  const table = TRADE_TABLE[currentTradeNpc.def.type] || TRADE_TABLE.default;
  const o = table[offerId];
  if (o) {
    const gk = Object.keys(o.give)[0], gn = o.give[gk];
    if ((itemCounts[gk] || 0) >= gn) { // 在庫足りる時だけ成立
      itemCounts[gk] -= gn;
      if (o.equip) grantEquip(o.equip);
      else { const k = Object.keys(o.get)[0]; itemCounts[k] = (itemCounts[k] || 0) + o.get[k]; }
      window.playSFX && window.playSFX('trade');
      updateHotbar(); scheduleSave();
    }
  }
  return buildTradeSession(currentTradeNpc);
};
// 近くの住人に話しかける（Tキー）
function talkToNPC() {
  let best = null, bd = 4.5; // 会話可能距離（雇用しやすいよう少し広め）
  for (const m of mobs) {
    if ((!m.home && !(m.def.ally && !m.companion)) || m.dying) continue; // 住人 or 味方動物（未仲間）
    const d = Math.hypot(m.obj.position.x - player.pos.x, m.obj.position.z - player.pos.z);
    if (d < bd) { bd = d; best = m; }
  }
  if (!best) { if (typeof toast === 'function') toast('近くに住人/仲間にできる動物がいません（村や、うさぎ/モルモット/リス/ハリネズミを探そう）'); return; }
  currentTradeNpc = best;
  best.obj.rotation.y = Math.atan2(-(player.pos.x - best.obj.position.x), -(player.pos.z - best.obj.position.z)); // プレイヤーを向く
  setMobAnim(best, 'talk');
  // 雇用の可否を必ず案内（仲間にできる相手だと分かるように・UIの有無に関わらず）
  const r = buildTradeSession(best).recruit;
  const hint = r.already ? '（もう仲間）'
    : r.full ? `（仲間は満員 最大${MAX_COMPANIONS}人）`
    : (itemCounts.coin||0) < r.cost ? `（仲間に: ${r.cost}コイン必要・不足）`
    : `→ Yキーで仲間にできる（${r.cost}コイン）`;
  if (window.UI && typeof window.UI.openTrade === 'function') window.UI.openTrade(buildTradeSession(best));
  if (typeof toast === 'function') toast(`${JOB_LABEL[best.def.type]||'住人'}「${NPC_GREETING[best.def.type]||'…'}」 ${hint}`);
}
function triggerHitstop(t) { hitstop = Math.max(hitstop, t); }
// 連携口：ヒット通知（UIのダメージ数字/エフェクト用）。UI側の例外で本体を止めない
function emitCombatHit(x, y, z, amount, isCrit, weapon, targetType, killed, comboIndex) {
  if (typeof window.onCombatHit === 'function') {
    try { window.onCombatHit({ x, y, z, amount, isCrit, weapon, targetType, killed, comboIndex }); } catch (e) {}
  }
}
function emitPlayerAttack(weapon, charged, comboIndex) {

    try { window.onPlayerAttack({ weapon, charged, comboIndex }); } catch (e) {}
  }

// 連携口：ワールド→画面座標（UIがDOMで数字/エフェクトを置くため）
const _projV = new THREE.Vector3();
window.worldToScreen = (x, y, z) => {
  _projV.set(x, y, z).project(camera);
  return {
    x: (_projV.x * 0.5 + 0.5) * innerWidth,
    y: (-_projV.y * 0.5 + 0.5) * innerHeight,
    onScreen: _projV.z < 1 && _projV.x >= -1 && _projV.x <= 1 && _projV.y >= -1 && _projV.y <= 1,
  };
};

// 入力：押下（弓は溜め開始 / 近接は振り。振り中はバッファ）
function onAttackDown() {
  mouseDown = true;
  const w = WEAPONS[currentWeapon];
  if (w.ranged) { drawTime = 0; window.onAttackCharge && window.onAttackCharge('start'); return; } // 弓：溜め開始音（2号機）
  if (swingTimer > 0) { attackBuffered = true; return; } // 振り切るまでバッファ
  startSwing();
}
function onAttackUp() {
  const wasDown = mouseDown;
  mouseDown = false;
  if (wasDown && WEAPONS[currentWeapon].ranged) shootPlayerArrow(Math.min(1, drawTime / CHARGE_FULL)); // 溜め分を発射
}
function startSwing() {
  const w = WEAPONS[currentWeapon];
  const isCrit = (comboIndex % 3 === 2); // 3発目が会心
  swingTimer = w.swing;
  comboTimer = COMBO_WINDOW;
  emitPlayerAttack(currentWeapon, isCrit, comboIndex);
  playAvatarAttack();
  window.playSFX && window.playSFX('swing');
  resolveMeleeHit(isCrit);
  comboIndex++;
}
// 前方扇形のマルチヒット。命中ゼロならブロック破壊（採掘）にフォールバック
function resolveMeleeHit(isCrit) {
  const w = WEAPONS[currentWeapon];
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const ox = player.pos.x, oy = player.pos.y + EYE, oz = player.pos.z;
  const reach = w.reach * (isCrit ? 1.15 : 1);
  const dot = Math.max(0, w.dot - (isCrit ? 0.15 : 0)); // 会心は扇を広げる
  let any = false;
  for (let i = mobs.length - 1; i >= 0; i--) {
    const m = mobs[i]; if (m.dying || m.pet) continue; // 🐾 自分のペットには当たらない（誤爆で殺さない）
    const p = m.obj.position;
    const vx = p.x - ox, vy = (p.y + 0.6) - oy, vz = p.z - oz;
    const d = Math.hypot(vx, vy, vz);
    if (d > reach) continue;
    if ((vx*dir.x + vy*dir.y + vz*dir.z) / (d || 1) < dot) continue; // 扇の外
    const dmg = w.dmg * (isCrit ? 1.6 : 1) * (1 + comboIndex * 0.05) + (playerLevel - 1) * CFG.level.dmgPerLevel; // Lv補正
    hitMob(m, dmg, isCrit, currentWeapon, comboIndex, p.x - ox, p.z - oz, w.knock * (isCrit ? 2.1 : 1.15)); // ③ ノックバック増（会心は特に大きく）
    any = true;
  }
  if (!any) breakBlock(); // 空振り＝採掘
  return any;
}
// 共通のモブ被弾処理（近接・弓の両方から）。ノックバック＋被弾/死亡アニメ＋ヒットストップ＋通知
function hitMob(m, dmg, isCrit, weapon, combo, kdirx, kdirz, knock) {
  if (m.dying) return;
  dmg = Math.max(1, Math.round(dmg));
  m.hp -= dmg;
  const kl = Math.hypot(kdirx, kdirz) || 1;
  m.obj.position.x += kdirx / kl * knock;
  m.obj.position.z += kdirz / kl * knock;
  const killed = m.hp <= 0;
  emitCombatHit(m.obj.position.x, m.obj.position.y + 0.9, m.obj.position.z, dmg, isCrit, weapon, m.def.type, killed, combo);
  // 3号機UI：ダメージ数字ポップ＋命中閃光（口が無ければ無害）
  if (window.spawnDamagePopup) window.spawnDamagePopup(m.obj.position.x, m.obj.position.y + 1, m.obj.position.z, dmg, { crit: isCrit });
  // 武器別ヒット音（2号機 onAttackHit が sword/axe/bow/fist で分岐）。口が無ければ汎用hitに退避
  if (typeof window.onAttackHit === 'function') window.onAttackHit(weapon, isCrit);
  else if (window.playSFX) window.playSFX(isCrit ? 'crit' : 'hit');
  flashMob(m);                                  // ③ 敵を白く光らせる（被弾mobだけマテリアルを遅延クローン）
  const whs = (WEAPONS[weapon] && WEAPONS[weapon].hitstop) || 0.08; // 武器別ヒットストップ（斧=長い/素手=短い）
  triggerHitstop(isCrit ? whs + 0.04 : whs);    // ③ ヒットストップ（会心は延長）
  camShake = Math.max(camShake, killed ? 0.6 : isCrit ? 0.5 : 0.18); // ③ 命中の画面シェイク（ui.js未配線でも手応え）
  if (killed) killMob(m);
  else { setMobAnim(m, 'hit'); m.hitStun = 0.22; } // 被弾アニメ＋小硬直
}
// ③ 敵の白フラッシュ：被弾したmobのマテリアルだけ遅延クローンし emissive を白へ→減衰（共有マテリアル汚染を回避）
function flashMob(m) {
  try {
    if (!m.flashMats) {
      m.flashMats = [];
      m.obj.traverse(o => {
        if (o.isMesh && o.material && o.material.emissive) {
          const mat = o.material.clone(); o.material = mat;
          m.flashMats.push({ mat, e: mat.emissive.clone(), ei: (mat.emissiveIntensity != null ? mat.emissiveIntensity : 1) });
        }
      });
    }
    m.flash = 0.14; // フラッシュ残り秒
  } catch (e) {}
}
function updateMobFlash(m, dt) {
  if (!m.flash || !m.flashMats) return;
  m.flash = Math.max(0, m.flash - dt);
  const k = m.flash / 0.14; // 1→0
  for (const f of m.flashMats) {
    f.mat.emissive.setRGB(f.e.r + (1 - f.e.r) * k, f.e.g + (1 - f.e.g) * k, f.e.b + (1 - f.e.b) * k);
    if (f.mat.emissiveIntensity != null) f.mat.emissiveIntensity = f.ei + 1.2 * k;
  }
}
function killMob(m) {
  m.dying = true; m.hp = 0;
  if (m.companion) { // 仲間が死んだら companions から即削除（HP0で残さない・UI/セーブからも消える・枠が空く）。離脱音を鳴らす
    const ci = companions.indexOf(m); if (ci >= 0) companions.splice(ci, 1);
    m.companion = false; m.cmdMode = null; removeAllyMarker(m);
    try { window.onCompanionLeave && window.onCompanionLeave(m.def.type); } catch (e) {}
    if (typeof toast === 'function') toast(`仲間が倒れた…（${JOB_LABEL[m.def.type]||m.def.type}）`);
    if (m.aDie) { setMobAnim(m, 'die'); m.dieTimer = (m.aDie.getClip().duration || 0.8); } else m.dieTimer = 0; // 死亡演出後に mobs から除去
    scheduleSave(); return; // 仲間死亡では討伐EXP/ドロップは出さない（味方なので）
  }
  if (m.pet) { // 🐾 ペットが倒れたら pets から即削除（次回起動で「さくら」は戻ってくる）。EXP/ドロップは出さない
    const pi = pets.indexOf(m); if (pi >= 0) pets.splice(pi, 1);
    m.pet = false; removePetMarker(m);
    if (typeof toast === 'function') toast(`🐾 ペット「${m.petName || ''}」が倒れた…`);
    if (m.aDie) { setMobAnim(m, 'die'); m.dieTimer = (m.aDie.getClip().duration || 0.8); } else m.dieTimer = 0;
    scheduleSave(); return;
  }
  spawnDrop(MOB_DROP[m.def.type], m.obj.position.x, m.obj.position.y, m.obj.position.z);
  maybeDropEquip(m); // 装備品の抽選ドロップ
  // 討伐EXP（敵の強さ＝最大HP比例、ボスは加算）
  gainExp(Math.ceil((M.hp[m.def.type] || 5) / CFG.level.killDivisor) + (m.def.role === 'boss' ? CFG.level.bossBonus : 0));
  if (m.def.role === 'boss') defeatBoss(m); // ⑥ ボス撃破の連携（ファンファーレ＋崩壊演出）＋特別報酬＋討伐記録
  if (m.aDie) { setMobAnim(m, 'die'); m.dieTimer = (m.aDie.getClip().duration || 0.8); }
  else m.dieTimer = 0; // dieクリップ無ければ次フレーム除去
}
// ⑥ ボス撃破：出現(roar＋魔法陣＋瘴気)→戦闘(bossBGM)→撃破(ファンファーレ＋崩壊＋特別報酬) で戦いを完結させる
function defeatBoss(m) {
  const p = m.obj.position, t = m.def.type;
  try { window.onBossDefeat && window.onBossDefeat(t); } catch (e) {}        // 撃破ファンファーレ（2号機）
  spawnFx('fx_collapse', p.x, p.y + 0.3, p.z, 3.5, 1.8);                     // 崩壊演出（4号機・自走loop）
  const rw = BOSS_REWARD[t] || { exp: 40, gold: 2, coin: 4, equips: 1, name: t };
  gainExp(rw.exp);                                                          // 大量EXP（通常討伐EXPへ上乗せ）
  itemCounts.gold = (itemCounts.gold || 0) + rw.gold;
  itemCounts.coin = (itemCounts.coin || 0) + rw.coin;
  const pool = ['armor', 'shield', 'sword', 'axe', 'bow'];
  for (let i = 0; i < rw.equips; i++)                                       // 確定レア装備（ボスを倒す意味）
    spawnEquipDrop(pool[Math.floor(Math.random()*pool.length)], p.x + (Math.random()*2-1), p.y, p.z + (Math.random()*2-1));
  if (rw.cape) { // ★最終ボス 女王さくら：金の剣も確定＋超レア「さくらの毛皮マント」
    spawnEquipDrop('gold_sword', p.x, p.y, p.z + 1);
    if (!hasSakuraCape) { hasSakuraCape = true; toast('★★ さくらの毛皮マントを獲得！（防御+10%・常時）'); }
  }
  bossKills[t] = (bossKills[t] || 0) + 1;                                   // 討伐数の記録（達成感）
  toast(`★ ${rw.name} 撃破！ 特別報酬：EXP+${rw.exp}・金+${rw.gold}・コイン+${rw.coin}・装備×${rw.equips}（討伐 ${bossKills[t]}体）`);
  scheduleSave();
}

// ===================================================================
// 必殺技（②）：Lvで習得・CD制・効果。3号機UI(onUseSkill/onLearnSkill)・2号機音(playSFX('skill'))と連携。
//   「レベルアップで覚える → ZXCVで発動 → 全画面演出」の循環で“成長して技を覚える”体験を作る。
// ===================================================================
function learnedSkills() { return CFG.special.list.filter(s => playerLevel >= s.learnLv); } // 現Lvで習得済みの技
function effectiveEquipped() { // 実際にHUD/キーで使う装備列。未設定なら習得順に最大4を既定装備
  const learned = learnedSkills();
  const eq = equippedSkills.filter(id => learned.some(s => s.id === id));
  return eq.length ? eq : learned.slice(0, 4).map(s => s.id);
}
// 習得状態を現Lvに同期。announce=true で新規習得を演出（Lvアップ時）/ false は静かに反映（ロード時）
function syncSkills(announce) {
  for (const s of CFG.special.list) {
    if (playerLevel < s.learnLv || skillKnown.has(s.id)) continue;
    skillKnown.add(s.id);
    if (equippedSkills.length < 4 && equippedSkills.indexOf(s.id) < 0) equippedSkills.push(s.id); // 空き枠に自動装備
    if (announce) {
      if (typeof window.onLearnSkill === 'function') { try { window.onLearnSkill({ name: s.name, icon: s.icon }); } catch (e) {} }
      if (typeof toast === 'function') toast(`✦ 新必殺技 習得！ ${s.name}`);
    }
  }
}
// 効果適用：前方/全方位の敵へまとめてダメージ（既存 hitMob を流用＝ポップ/音/ノックバック/撃破が乗る）
function applySkillDamage(s) {
  const w = WEAPONS[currentWeapon];
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const ox = player.pos.x, oy = player.pos.y + EYE, oz = player.pos.z;
  const base = (w.dmg + (playerLevel - 1) * CFG.level.dmgPerLevel) * s.mult;
  const need = s.effect === 'line' ? 0.93 : s.effect === 'strike' ? 0.35 : -1; // aoe=全方位 / strike=前方広 / line=細い前方貫通
  let hits = 0;
  for (let i = mobs.length - 1; i >= 0; i--) {
    const m = mobs[i]; if (m.dying || m.pet) continue; // 🐾 自分のペットには当たらない（誤爆で殺さない）
    const p = m.obj.position;
    const vx = p.x - ox, vy = (p.y + 0.6) - oy, vz = p.z - oz;
    const d = Math.hypot(vx, vy, vz);
    if (d > s.range) continue;
    if (need > -1 && (vx*dir.x + vy*dir.y + vz*dir.z) / (d || 1) < need) continue; // 前方判定（aoeは無条件）
    hitMob(m, base, true, currentWeapon, 0, p.x - ox, p.z - oz, s.knock); // isCrit=true 扱いで特大演出
    hits++;
  }
  return hits;
}
// 必殺技の発動：習得＆CD空きを確認 → 効果適用 → 演出(onUseSkill)＋音 → CD開始
function useSkill(id) {
  const s = CFG.special.list.find(x => x.id === id);
  if (!s || playerLevel < s.learnLv) return false;                                   // 未習得
  if ((skillCd[id] || 0) > 0) { if (typeof toast === 'function') toast(`${s.name}は準備中`); return false; } // CD中
  if (s.effect === 'heal') {
    const before = hp; hp = Math.min(maxHpEff(), hp + (s.amount || 0)); const healed = Math.round(hp - before);
    if (window.spawnDamagePopup) window.spawnDamagePopup(player.pos.x, player.pos.y + 1.2, player.pos.z, healed, { heal: true });
  } else {
    applySkillDamage(s);
  }
  skillCd[id] = s.cd;
  if (typeof window.onUseSkill === 'function') { try { window.onUseSkill(id, { name: s.name, kind: s.kind, color: s.color }); } catch (e) {} } // 3号機：全画面FX＋技名バナー＋画面シェイク
  window.playSFX && window.playSFX('skill', { kind: s.kind }); // 2号機：kind別は opts.kind で（未定義でも無音で安全）
  camShake = Math.max(camShake, s.kind === 'slash' ? 0.85 : s.kind === 'buff' ? 0.3 : 0.6); // ③ 必殺技の画面シェイク
  scheduleSave();
  return true;
}
// 装備トグル（最大4・習得済みのみ）。3号機の技選択UIから VoxelGame.equipSkill 経由で呼ばれる
function equipSkill(id) {
  if (!learnedSkills().some(s => s.id === id)) return false;
  const i = equippedSkills.indexOf(id);
  if (i >= 0) equippedSkills.splice(i, 1);
  else { if (equippedSkills.length >= 4) return false; equippedSkills.push(id); }
  scheduleSave(); return true;
}
// Z/X/C/V キー → 該当スロットの装備技を発動（インベントリ中は無効）
function fireSkillKey(slot) { if (invOpen) return false; const id = effectiveEquipped()[slot]; return id ? useSkill(id) : false; }
// クールダウンの毎フレーム減算（ループから gdt で）
function updateSkills(dt) { for (const id in skillCd) if (skillCd[id] > 0) skillCd[id] = Math.max(0, skillCd[id] - dt); }
// 弓：溜め(power 0..1)に応じて速度・威力が上がる味方の矢を放つ
function shootPlayerArrow(power) {
  const w = WEAPONS.bow;
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const ox = player.pos.x, oy = player.pos.y + EYE, oz = player.pos.z;
  const speed = 14 + power * 16;
  const isCrit = power >= 0.99;
  const dmg = w.dmg * (0.5 + power * 0.8) + (playerLevel - 1) * CFG.level.dmgPerLevel; // Lv補正
  shootArrowEx(ox + dir.x, oy + dir.y, oz + dir.z, dir.x, dir.y, dir.z, speed, true, dmg, isCrit);
  emitPlayerAttack('bow', isCrit, 0);
  playAvatarAttack();
  window.playSFX && window.playSFX('bow');
}
// 攻撃状態の更新（振り時間・コンボ猶予・弓の溜め・アバター攻撃モーション）。ループから gdt で呼ぶ
function updateAttack(dt) {
  if (swingTimer > 0) {
    swingTimer -= dt;
    if (swingTimer <= 0 && attackBuffered) { attackBuffered = false; startSwing(); } // バッファ分を継続
  }
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) comboIndex = 0; }
  if (avatarAttackTimer > 0) avatarAttackTimer -= dt;
  if (WEAPONS[currentWeapon].ranged && mouseDown) {
    const was = drawTime; drawTime += dt;
    if (was < CHARGE_FULL && drawTime >= CHARGE_FULL) window.onAttackCharge && window.onAttackCharge('full'); // 溜め完了音（2号機）
  }
}
// 戦闘BGM：近くに敵がいれば combat、水中は water、それ以外は時間帯。切替時だけ口を叩く
// BGMシーンは「毎フレーム再評価＋特殊→平常へ自動復帰」の一本ロジック（water/combat 固着の根絶）
//   優先順位：水中 water ＞ 戦闘 combat(ヒステリシス付) ＞ 時間帯 day/night
let musicScene = '', musicTimer = 0, combatHold = 0, bossHold = 0, dbgNearEnemies = 0, dbgMusicWater = false;
const COMBAT_RADIUS = 14;   // この距離内に敵がいれば戦闘
const COMBAT_HOLD = 4;      // 敵がいなくなってから平常へ戻すまでの猶予秒（チャタリング防止）
function updateCombatMusic(dt) {
  // 近接敵数は毎フレーム数える（ヒステリシスを正確に）
  let near = 0, bossNear = false;
  for (const m of mobs) {
    if (m.hostile && !m.dying
        && Math.hypot(m.obj.position.x - player.pos.x, m.obj.position.z - player.pos.z) < COMBAT_RADIUS
        && Math.abs(m.obj.position.y - player.pos.y) < 4) { near++; if (m.def.role === 'boss') bossNear = true; } // 高低差4超（地下/上空）の敵は戦闘BGMに数えない
  }
  dbgNearEnemies = near;
  if (near > 0) combatHold = COMBAT_HOLD; else combatHold = Math.max(0, combatHold - dt); // 0体になったら数秒で解除
  if (bossNear) bossHold = COMBAT_HOLD; else bossHold = Math.max(0, bossHold - dt); // ⑥ ボス戦BGMの保持（離脱/撃破後も数秒）
  musicTimer -= dt;
  if (musicTimer > 0) return;
  musicTimer = 0.25;
  const px = Math.floor(player.pos.x), pz = Math.floor(player.pos.z);
  const inWater = playerHeadInWater(); // ★物理/swim/溺れ と同じ統一基準（頭水中）
  dbgMusicWater = inWater;
  // ⑥ ボスが近ければ最重厚の boss シーン（2号机）。次いで combat → 水中 → 夜/昼。
  const sc = bossHold > 0 ? 'boss' : inWater ? 'water' : combatHold > 0 ? 'combat' : isNight() ? 'night' : 'day';
  if (sc !== musicScene) {
    // ★成功時のみキャッシュ更新：sound.js 未準備なら更新せず次フレーム再試行
    if (typeof window.setMusicScene === 'function') { try { window.setMusicScene(sc); musicScene = sc; } catch (e) {} }
  }
}
window.getMusicScene = () => musicScene; // 診断用
// 祠セルの中心（buildStructures の祠ループと同一判定）。getBiome 用。
function shrineCenter(gx, gz, cell) {
  if (hash2(gx*83+7, gz*83+29) > 0.22) return null;
  const ox = gx*cell + 10 + Math.floor(hash2(gx+6, gz+15) * (cell-20));
  const oz = gz*cell + 10 + Math.floor(hash2(gx+12, gz+4) * (cell-20));
  if (biomeAt(ox, oz) === 'ocean') return null;
  if (heightAt(ox, oz) <= WATER_LEVEL) return null;
  return { x: ox, z: oz };
}
// ② getBiome（2号機の環境音用）：王国城内='castle' / 祠の近く='shrine' / それ以外=地形バイオーム。
//   決定論hashなので軽い（プレイヤーのセル＋隣接のみ評価）。castle/shrine で聖歌・鈴の環境音が鳴る。
window.getBiome = () => {
  const px = player.pos.x, pz = player.pos.z;
  const cgx = Math.floor(px/CASTLE_CELL), cgz = Math.floor(pz/CASTLE_CELL);
  for (let gx = cgx-1; gx <= cgx+1; gx++) for (let gz = cgz-1; gz <= cgz+1; gz++) {
    const c = castleCenter(gx, gz, CASTLE_CELL);
    if (c && Math.abs(c.x-px) <= 9 && Math.abs(c.z-pz) <= 9) return 'castle'; // 城壁(R=8)内
  }
  const sgx = Math.floor(px/SHRINE_CELL), sgz = Math.floor(pz/SHRINE_CELL);
  for (let gx = sgx-1; gx <= sgx+1; gx++) for (let gz = sgz-1; gz <= sgz+1; gz++) {
    const c = shrineCenter(gx, gz, SHRINE_CELL);
    if (c && Math.abs(c.x-px) <= 3 && Math.abs(c.z-pz) <= 3) return 'shrine'; // 祠のそば
  }
  return biomeAt(Math.floor(px), Math.floor(pz)); // 地形バイオーム（plains/desert/snow/ocean…）
};

// ===================================================================
// 外部連携の口（2号機の空間オーディオ ③ 用。読み取り専用・副作用なし）
//   getMobPositions: 各モブの位置・種別・敵性。getPlayerPose: プレイヤーの位置と向き

  type: m.def.type, hostile: m.hostile,
}));
window.getPlayerPose = () => ({
  x: player.pos.x, y: player.pos.y, z: player.pos.z,
  yaw: player.yaw, pitch: player.pitch,
});

// ===================================================================
// メインループ
// ===================================================================
let last = performance.now();
let autoSaveAccum = 0;                // 定期オートセーブの経過秒
const AUTOSAVE_INTERVAL = 20;         // オートセーブ間隔（秒）
let fpsEMA = 60;                      // 診断用 FPS（指数移動平均）
let pathSecTimer = 1;                 // 経路探索負荷の1秒集計タイマー
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.05); // タブ復帰時などの暴れ防止
  if (dt > 0) fpsEMA += (1/dt - fpsEMA) * 0.1; // FPS を滑らかに追従
  pathSecTimer -= dt;
  if (pathSecTimer <= 0) { pathSecTimer = 1; pathCallsPerSec = pathCallsAcc; pathNodesPerSec = pathNodesAcc; pathCallsAcc = 0; pathNodesAcc = 0; }

  // ヒットストップ：命中の瞬間ごく短くアクションをほぼ静止させて「手応え」を出す
  const inHitstop = hitstop > 0;
  hitstop = Math.max(0, hitstop - dt);
  const gdt = inHitstop ? dt * 0.04 : dt; // アクション系に渡す減速dt（環境は通常dtのまま）

  if (isPlaying() && !invOpen && !playerDead) { // ★PC=ロック成立 / スマホ=タップ開始 で本編シミュを回す（インベントリ/死亡中は休止）
    updateAttack(gdt); // 攻撃の振り・コンボ・溜め
    updateSkills(gdt); // 必殺技クールダウンの減算
    updatePlayer(gdt); updateHealth(dt); updateMobs(gdt); updateArrows(gdt); updateDrops(dt);
    updateCombatMusic(dt); // 戦闘/水中/時間帯でBGMシーン切替（2号機の口）
    // 定期オートセーブ：時刻天候・モブ・位置の進行も一定間隔で残す（編集イベント時の scheduleSave とは別系統）
    autoSaveAccum += dt;
    if (autoSaveAccum >= AUTOSAVE_INTERVAL) { autoSaveAccum = 0; saveWorld(); }
  }
  stepWeatherAuto(dt);
  updateSky(dt);
  updateParticles(dt);
  updateClouds(dt);
  updateProps(dt); // ② 構造物プロップ(GLB)の表示・アニメ
  updateFx(dt);    // ⑥ ボス出現fx演出の更新（数秒で自動消滅）
  if (mixer) mixer.update(gdt); // アバターのアニメ再生（ヒットストップに同期）
  updateHeldTransforms(); // §3 ワールド追従：腕ポーズ確定後に武器/盾を手へ写す（毎フレーム）
  updateChunks();
  renderer.render(scene, camera);

  // 時刻表示（dayTime 0.5 を正午=12:00 として24時間換算）
  const hh = Math.floor(((dayTime + 0.5) % 1) * 24);
  const mm = Math.floor((((dayTime + 0.5) % 1) * 24 % 1) * 60);
  const WNAME = { clear:'晴れ', rain:'雨', snow:'雪', thunder:'雷' };
  const wpn = WEAPONS[currentWeapon];
  const draw = (wpn.ranged && mouseDown) ? `　弓溜め:${Math.round(Math.min(1, drawTime/CHARGE_FULL)*100)}%` : '';
  const def = defenseFactor() > 0 ? `　防御:${(defenseFactor()*100).toFixed(0)}%` : '';
  hud.innerHTML =
    `XYZ: ${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}<br>` +
    `時刻: ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}　読込チャンク: ${meshes.size}　FPS: ${fpsEMA.toFixed(0)}<br>` +
    `天候: ${WNAME[weather]}${autoWeather ? '(自動)' : ''}（G切替/J自動）　武器: ${wpn.name}（C切替）${draw}${def}　H:診断`;
  if (diagVisible) diagEl.textContent = buildDiag();

  // 体力・空腹・息・被ダメージ表示
  hpEl.innerHTML = heartsHTML();
  hungerEl.innerHTML = hungerHTML();
  hurtEl.style.opacity = (hurtFlash * 0.7).toFixed(2);
  // 息ゲージ：負値・0除算・Infinity でも repeat() が落ちないよう 0..10 にクランプ
  const bubbles = Math.max(0, Math.min(10, Math.ceil(breath / Math.max(0.001, P.breathMax) * 10)));
  breathEl.textContent = (breath < P.breathMax - 0.05) ? '🫧'.repeat(bubbles) : '';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
